---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ptxedgeworkers.dataspace.ptx.org # <plural>.<group> format
spec:
  group: dataspace.ptx.org
  scope: Namespaced
  names:
    kind: PtxEdgeWorker
    listKind: PtxEdgeWorkersList
    plural: ptxedgeworkers
    singular: ptxedgeworker
    shortNames:
      - pew
      - pews
    categories:
      - all
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: "PTX Edge Worker description"
          required:
            - spec
          properties:
            spec:
              type: object
              description: "Specification of PTX Edge Worker"
              required:
                - data
                - worker
              x-kubernetes-validations:
                - rule: "self.data.src.method != 'PTX' || has(self.dataspace.exchange.data)"
                  message: "Data source method: PTX requires a dataspace contract!"
                  fieldPath: ".dataspace.exchange.data"
                - rule: "self.worker.location.method != 'PTX' || has(self.dataspace.exchange.worker)"
                  message: "Worker collection method: PTX requires a dataspace contract!"
                  fieldPath: ".dataspace.exchange.worker"
              properties:
                service:
                  type: object
                  description: "Initiate worker as a service, not a single-executed task"
                  required:
                    - enabled
                  properties:
                    enabled:
                      type: boolean
                      description: "Enable service creation"
                      default: false
                    interfaces:
                      type: array
                      description: "Exposed worker interfaces"
                      minItems: 1
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [ port ]
                      x-kubernetes-validations:
                        - rule: 'size(self.filter(i, i.public)) <= 1'
                          message: 'Only one interface/port can be public!'
                      items:
                        type: object
                        required:
                          - port
                        x-kubernetes-validations:
                          - rule: "self.public >= self.secured"
                            message: "Only public port can be secured!"
                            fieldPath: ".secured"
                        properties:
                          port:
                            type: integer
                            description: "Service port"
                            minimum: 1
                            maximum: 65535
                            example: 8080
                          public:
                            type: boolean
                            description: "Enable out-of-cluster access"
                            default: false
                          secured:
                            type: boolean
                            description: "Apply the same security measures as of the REST-API, e.g., authentication"
                            default: false
                data:
                  type: object
                  description: "Data collection parameters"
                  required:
                    - src
                  properties:
                    src:
                      type: object
                      description: "Data source location"
                      required:
                        - method
                      x-kubernetes-validations:
                        - rule: 'self.method in ["PTX", "SKIP"] || size(self.path) > 0'
                          messageExpression: '"method: " + self.method + " requires a valid data resource path!"'
                          fieldPath: ".path"
                        - rule: '!has(self.path) || self.method != "SKIP" &&
                                  self.path.lowerAscii().startsWith(self.method.lowerAscii()+":")'
                          messageExpression: '"Heading scheme in path must start with method: " 
                                              + self.method.lowerAscii() + "!"'
                          fieldPath: ".path"
                      properties:
                        method:
                          type: string
                          description: "Data collection method"
                          enum: [ FILE, DIR, HTTP, HTTPS, PTX, SKIP ]
                          example: HTTPS
                        path:
                          type: string
                          description: "Data resource location"
                          minLength: 1
                          #format: "[scheme]://([host][:port])/[path]"
                          pattern: ^([^:/]+://)([^:/]+(:[0-9]{1,5})?)?(/.+)$
                          example: https://my.api.localhost:8080/data/example.csv
                        size:
                          type: integer
                          description: "Requested data size in Megabyte (Mb)"
                          minimum: 1
                          #maximum: 10240
                          default: 100
                        auth:
                          type: object
                          description: "Authentication parameters for remote data collection"
                          required:
                            - scheme
                            - user
                            - secret
                          properties:
                            scheme:
                              type: string
                              description: "Used authentication method"
                              enum: [ BASIC, DIGEST, BEARER ]
                              example: BASIC
                            user:
                              type: string
                              description: "User identification"
                              minLength: 1
                              example: admin
                            secret:
                              type: string
                              description: "Secret token or password"
                              minLength: 1
                              format: password
                              example: myPasswd!007
                            insecure:
                              type: boolean
                              description: "Disable verification of data server's TLS certificate"
                              default: false
                    dst:
                      type: object
                      description: "Data destination location"
                      properties:
                        method:
                          type: string
                          description: "Data propagation scheme"
                          enum: [ LOCAL ]
                          default: LOCAL
                        path:
                          type: string
                          description: "Data resource location"
                          minLength: 1
                          #format: "/[path]/"
                          pattern: ^((/[a-zA-Z0-9-_]+)+)/?$
                          default: /var/cache/data
                worker:
                  type: object
                  description: "Worker environment parameters"
                  required:
                    - location
                  x-kubernetes-validations:
                    - rule: '!has(self.name) || size(self.name) > 0 && self.cached'
                      messageExpression: '"Image with new name: " + self.name + " requires cacheing!"'
                      fieldPath: ".cached"
                  properties:
                    location:
                      type: object
                      description: "Worker image location"
                      required:
                        - method
                      x-kubernetes-validations:
                        - rule: '!(self.method in ["DOCKER", "SECRET"]) || has(self.image) && size(self.image) > 0'
                          messageExpression: '"method: " + self.method + " requires a valid image!"'
                          fieldPath: ".image"
                      properties:
                        method:
                          type: string
                          description: "Image pull approach"
                          enum: [ DOCKER, PTX, INLINE, DATASOURCE, SECRET, SKIP ]
                          example: DOCKER
                        image:
                          type: string
                          description: "Image resource location"
                          minLength: 1
                          #format: "([scheme]://)([host][:port]/)[name][:version]"
                          pattern: ^([^:/]+://)?([^:/]+(:[0-9]{1,5})?/)?([^:]+):([^:/]+)$
                          example: busybox:latest
                        cred:
                          type: object
                          description: "Credentials for remote image collection"
                          required:
                            - user
                            - secret
                          properties:
                            server:
                              type: string
                              description: "Image server prefix"
                              minLength: 1
                              #format: "[scheme]://[host][:port]/[path]/"
                              pattern: ^([^:/]+)(://)([^:/]+(:[0-9]{1,5})?)((/[^/]+)*)/$
                              default: https://index.docker.io/v1/
                            user:
                              type: string
                              description: "Image registry user"
                              minLength: 1
                              example: admin
                            secret:
                              type: string
                              description: "Server password or token"
                              minLength: 1
                              format: password
                              example: myPasswd!007
                            insecure:
                              type: boolean
                              description: "Disable verification of image server's TLS certificate"
                              default: false
                    cached:
                      type: boolean
                      description: "Worker cached in local registry"
                      default: true
                    name:
                      type: string
                      description: "Cached image name, otherwise autogenerated from source image"
                      minLength: 1
                      #format: "([group]/)[name][:version]"
                      pattern: ^([^:/]+/)?([^:]+):([^:/]+)$
                      example: myworker:latest
                    command:
                      type: array
                      description: "Override image start command"
                      minItems: 1
                      items:
                        type: string
                        description: "command & args"
                        minLength: 1
                    demands:
                      type: object
                      description: "Operating resource demands"
                      properties:
                        cpu:
                          type: number
                          description: "Number of requested vCPU cores"
                          format: float
                          minimum: 0.5
                          example: 1.5
                        memory:
                          type: integer
                          description: "Amount of requested memory in Megabyte (Mb)"
                          minimum: 1
                          example: 1024
                    config:
                      type: object
                      description: "Worker image configuration parameters"
                      properties:
                        file:
                          type: object
                          description: "Configuration file"
                          required:
                            - path
                            - data
                          properties:
                            path:
                              type: string
                              description: "Mount path of configuration file"
                              minLength: 1
                              pattern: ^((/[a-zA-Z0-9-_\.]+)+)$
                              example: /var/cache/worker/cfg.ini
                            data:
                              type: string
                              description: "Configuration data"
                        env:
                          type: array
                          description: "Environment variables"
                          minItems: 1
                          x-kubernetes-list-type: map
                          x-kubernetes-list-map-keys: [ key ]
                          items:
                            type: object
                            description: "Key-value pairs"
                            required:
                              - key
                            properties:
                              key:
                                type: string
                                description: "Variable name"
                                minLength: 1
                                example: MY_CFG_ENVVAR
                              value:
                                type: string
                                description: "Value string"
                                example: "42"
                dataspace:
                  type: object
                  description: "PTX dataspace-related configuration"
                  properties:
                    exchange:
                      type: object
                      description: "Attributes of data exchange via PTX dataspace"
                      properties:
                        data:
                          type: object
                          description: "Dataspace contract information for data exchange"
                          required:
                            - contract
                            - provider
                            - consumer
                          properties:
                            contract:
                              type: string
                              description: "Dataspace contract ID"
                              minLength: 1
                              pattern: ^[0-9a-fA-F]+$
                              example: "66db1a6dc29e3ba863a85e0f"
                            provider:
                              type: object
                              description: "Data provider configuration"
                              required:
                                - offer
                                - resource
                              properties:
                                offer:
                                  type: string
                                  description: "Data offering ID"
                                  minLength: 1
                                  pattern: ^[0-9a-fA-F]+$
                                  example: "66d187f4ee71f9f096bae8ca"
                                resource:
                                  type: string
                                  description: "Data resource ID"
                                  minLength: 1
                                  pattern: ^[0-9a-fA-F]+$
                                  example: "66d1889cee71f9f096bae98b"
                            consumer:
                              type: object
                              description: "Data consumer configuration"
                              required:
                                - offer
                                - resource
                              properties:
                                offer:
                                  type: string
                                  description: "Service offering ID"
                                  minLength: 1
                                  pattern: ^[0-9a-fA-F]+$
                                  example: "66d18b79ee71f9f096baecb1"
                                resource:
                                  type: string
                                  description: "Software resource ID"
                                  minLength: 1
                                  pattern: ^[0-9a-fA-F]+$
                                  example: "66d18bf6ee71f9f096baed58"
                        worker:
                          type: object
                          description: "Dataspace contract information for worker exchange"
                          required:
                            - contract
                            - provider
                            - consumer
                          properties:
                            contract:
                              type: string
                              description: "Dataspace contract ID"
                              minLength: 1
                              pattern: ^[0-9a-fA-F]+$
                              example: "66db1a6dc29e3ba863a85e0f"
                            provider:
                              type: object
                              description: "Data provider configuration"
                              required:
                                - offer
                                - resource
                              properties:
                                offer:
                                  type: string
                                  description: "Data offering ID"
                                  minLength: 1
                                  pattern: ^[0-9a-fA-F]+$
                                  example: "66d187f4ee71f9f096bae8ca"
                                resource:
                                  type: string
                                  description: "Data resource ID"
                                  minLength: 1
                                  pattern: ^[0-9a-fA-F]+$
                                  example: "66d1889cee71f9f096bae98b"
                            consumer:
                              type: object
                              description: "Data consumer configuration"
                              required:
                                - offer
                                - resource
                              properties:
                                offer:
                                  type: string
                                  description: "Service offering ID"
                                  minLength: 1
                                  pattern: ^[0-9a-fA-F]+$
                                  example: "66d18b79ee71f9f096baecb1"
                                resource:
                                  type: string
                                  description: "Software resource ID"
                                  minLength: 1
                                  pattern: ^[0-9a-fA-F]+$
                                  example: "66d18bf6ee71f9f096baed58"
                    privacy:
                      type: object
                      description: "Privacy zone restriction policies"
                      properties:
                        required:
                          type: boolean
                          description: "Demands PTX-edge specific scheduler"
                          default: true
                        scheduler:
                          type: string
                          description: "Used scheduling method"
                          enum: [ DEFAULT, PRIVATE ]
                          default: PRIVATE
                        zones:
                          type: array
                          description: "List of privacy zones as node selection criteria"
                          minItems: 1
                          x-kubernetes-list-type: map
                          x-kubernetes-list-map-keys: [ name ]
                          x-kubernetes-validations:
                            - rule: 'size(self.filter(i, i.preferred)) <= 1'
                              message: 'Only one zone can be preferred!'
                          items:
                            type: object
                            description: "Privacy zone"
                            required:
                              - name
                            properties:
                              name:
                                type: string
                                description: "Unique zone name"
                                minLength: 1
                                patters: ^[^:/]+$
                                example: "zone-1"
                              preferred:
                                type: boolean
                                description: "Prefer zone during scheduling and data transition"
                                default: false
            status:
              type: object
              description: "Runtime information"
              x-kubernetes-preserve-unknown-fields: true
              properties:
                state:
                  type: string
                  description: "Task state from [created | running | finished]"
      subresources:
        status: { }
      selectableFields:
        - jsonPath: .spec.service.enabled
        - jsonPath: .status.state
      additionalPrinterColumns:
        - name: Datasource
          type: string
          description: "Datasource collection method"
          jsonPath: .spec.data.src.method
          priority: 0
        - name: Path
          type: string
          description: "Datasource configuration"
          jsonPath: .spec.data.src.path
          priority: 1
        - name: Worker
          type: string
          description: "Worker collection method"
          jsonPath: .spec.worker.location.method
          priority: 0
        - name: Image
          type: string
          description: "Worker collection image"
          jsonPath: .spec.worker.location.image
          priority: 1
        - name: Service
          type: boolean
          jsonPath: .spec.service.enabled
          description: "Enabled as a Service"
          priority: 0
        - name: State
          type: string
          jsonPath: .status.state
          priority: 1
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
          priority: 0
---
