apiVersion: dataspace.ptx.org/v1alpha1
kind: PtxEdgeWorker
metadata:
  name: test
  namespace: ptx-edge
  labels:
    env: test
spec:
  service:
    enabled: true
    interfaces:
      - port: 8080  # Expose container port
        public: true  # Set out of cluster access to the service
        secured: false # Do not use HTTPS entrypoint by default
        restricted: false  # Use basic authentication
        # wget -v -O- http://localhost:8888/worker/test/hosts
  data:
    src:
      method: FILE  # Use local file as source
      path: file:///etc/hosts
      size: 10
    dst:
      method: LOCAL
      path: "/usr/data/"
  worker:
    src:
      method: DOCKER
      image: "busybox:latest"
    dst:
      cached: false
    command: [ 'httpd', '-vv', '-f', '-p', '0.0.0.0:8080', '-h', '/usr/data/' ]
    demands: # Define min resource requirements
      cpu: 1.0
      memory: 50
