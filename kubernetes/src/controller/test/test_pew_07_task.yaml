apiVersion: dataspace.ptx.org/v1alpha1
kind: PtxEdgeWorker
metadata:
  name: test
  namespace: ptx-edge
  labels:
    env: test
spec:
  service:  # Default to assume task execution, i.e., no services
    enabled: false
  data:
    src:
      method: SKIP
    dst:
      method: LOCAL
      path: "/usr/data/"  # Useless configuration but syntactically acceptable
  worker:
    src:
      method: SKIP
      image: "busybox:latest"
    command:
      - "/bin/sh"
      - "-c"
      - "i=1; while [ ${i} -le ${DELAY_SEC} ]; do echo 'Processing...'; sleep 1; i=$((i+1)); done; echo 'Done.'"
    config:
      env: # Add explicit envvars
        - key: DELAY_SEC
          value: "10"
    demands: # Define min resource requirements
      cpu: 1.0
      memory: 50
