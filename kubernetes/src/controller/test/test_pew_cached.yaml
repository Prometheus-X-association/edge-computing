apiVersion: dataspace.ptx.org/v1alpha1
kind: PtxEdgeWorker
metadata:
  name: test
  namespace: ptx-edge
  labels:
    env: test
spec:
  service:
    enabled: true
  data:
    src:
      method: SKIP
  worker:
    src:
      method: DOCKER  # Similar as SKIP but with cache control and credentials
      image: k8s.gcr.io/pause:latest
    dst:
      cached: true  # Store image in local registry
      name: testing/myworker:latest # Use given name with 'worker/' prefix
