apiVersion: dataspace.ptx.org/v1alpha1
kind: PtxEdgeWorker
metadata:
  name: example
  namespace: ptx-edge
  labels:
    env: test
spec:
  service:
    enabled: true
    interfaces:
      - port: 8080
      - port: 80
        public: true
        secured: true
  data:
    src:
      method: PTX
      path: "https://github.com:8080/czeni/sample-datasets/raw/refs/heads/main/mnist_train_data.npz"
      size: 75
      auth:
        scheme: BASIC
        user: admin
        secret: admin
        insecure: true
    dst:
      method: LOCAL
      path: "/data"
  worker:
    location:
      method: SKIP
      image: "busybox:latest"
      cred:
        server: "https://index.docker.io/v1/"
        user: admin
        secret: admin
        insecure: false
    demands:
      cpu: 1.5
      memory: 500
    cached: true
    name: "myworker:latest"
    command:
      - "/bin/sh"
      - "-c"
      - "sleep infinity"
    config:
#      file:
#        path: "/var/cache/worker/config.json"
#        data: |
#          {
#            "test": 42
#          }
      env:
        - key: WRK_TEST_VAR
          value: "test123"
        - key: WRK_TEST_VAR2
          value: "42"
  dataspace:
    exchange:
      data:
        contract: 66db1a6dc29e3ba863a85e0f
        provider:
          offer: 66d187f4ee71f9f096bae8ca
          resource: d66d1889cee71f9f096bae98b
        consumer:
          offer: 66d18b79ee71f9f096baecb1
          resource: 66d18bf6ee71f9f096baed58
      worker:
        contract: 77db1a6dc29e3ba863a85e0f
        provider:
          offer: 77d187f4ee71f9f096bae8ca
          resource: 77d1889cee71f9f096bae98b
        consumer:
          offer: 77d18b79ee71f9f096baecb1
          resource: 77d18bf6ee71f9f096baed58
    privacy:
      required: true
      scheduler: DEFAULT
      zones:
        - name: zone1
        - name: zone2
          preferred: true
