apiVersion: dataspace.ptx.org/v1alpha1
kind: PtxEdgeWorker
metadata:
  name: test-example
  namespace: ptx-edge
  labels:
    env: test
spec:
  service:
    enabled: true
    interfaces:
      - port: 8080
      - port: 80
        public: true
        secured: true
  data:
    src:
      scheme: https
      path: "https://github.com:8080/czeni/sample-datasets/raw/refs/heads/main/mnist_train_data.npz"
      auth:
        method: basic
        user: admin
        secret: admin
    dst:
      scheme: local
      path: "/data"
  worker:
    location:
      protocol: docker
      image: "busybox:latest"
      cred:
        server: "https://index.docker.io/v1/"
        user: admin
        secret: admin
        insecure: false
    cached: true
    name: "myworker:latest"
    command: [ "/bin/bash", "date" ]
    config:
      file:
        path: "/var/cache/worker/config.json"
        data: |
          {
            "test": 42
          }
      env:
        - key: WRK_TEST_VAR
          value: "test123"
  dataspace:
    exchange:
      contract: 66db1a6dc29e3ba863a85e0f
      provider:
        offer: 66d187f4ee71f9f096bae8ca
        resource: 66d1889cee71f9f096bae98b
      consumer:
        offer: 66d18b79ee71f9f096baecb1
        resource: 66d18bf6ee71f9f096baed58