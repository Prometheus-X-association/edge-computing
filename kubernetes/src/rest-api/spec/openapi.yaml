openapi: 3.1.0
info:
  title: PTX Edge Computing REST-API
  description: The Edge Computing (Decentralized AI processing) BB-02 provides value-added
    services exploiting an underlying distributed edge computing infrastructure.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
  x-creation-date: '2026-09-07T12:36:20'
servers:
- url: /
  description: PTX Edge Computing
paths:
  /version:
    get:
      tags:
      - Internal
      summary: Get Versions
      description: Versions of the REST-API component
      operationId: get_versions_version_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionsResponse'
    head:
      tags:
      - Internal
      summary: Get Versions
      description: Versions of the REST-API component
      operationId: get_versions_version_head
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionsResponse'
  /health:
    get:
      tags:
      - Internal
      summary: Health
      description: For health check purposes
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
    head:
      tags:
      - Internal
      summary: Health
      description: For health check purposes
      operationId: health_health_head
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /workers/{name}:
    get:
      tags:
      - Customer
      summary: Get Worker By Name
      description: Obtain deployed PTX-Edge worker with given name
      operationId: get_worker_by_name_workers__name__get
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_-]+$
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PEW-Output'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Not Found
        '424':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Failed Dependency
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Customer
      summary: Create Worker With Name
      description: Create PTX-Edge worker with given name
      operationId: create_worker_with_name_workers__name__put
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_-]+$
          title: Name
      - name: label
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            prefixItems:
            - type: string
              pattern: ^(.+)=(.+)$
            minItems: 1
            maxItems: 1
          - type: 'null'
          examples:
          - tier=worker
          title: Label
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PEW-Input'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeWorkerResponse'
        '406':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Not Acceptable
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Conflict
        '424':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Failed Dependency
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Customer
      summary: Delete Worker By Name
      description: Delete PTX-Edge worker with given name
      operationId: delete_worker_by_name_workers__name__delete
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_-]+$
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeWorkerResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Not Found
        '424':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Failed Dependency
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workers:
    post:
      tags:
      - Customer
      summary: Create Worker
      description: Create PTX-Edge worker with autogenerated name
      operationId: create_worker_workers_post
      parameters:
      - name: label
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            prefixItems:
            - type: string
              pattern: ^(.+)=(.+)$
            minItems: 1
            maxItems: 1
          - type: 'null'
          examples:
          - tier=worker
          title: Label
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PEW-Input'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeWorkerResponse'
        '406':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Not Acceptable
        '424':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Failed Dependency
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Cluster
      summary: List All Workers
      description: Obtain deployed PTX-Edge workers
      operationId: list_all_workers_workers_get
      parameters:
      - name: resource
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Resource
      - name: label
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            prefixItems:
            - type: string
              pattern: ^(.+)=(.+)$
            minItems: 1
            maxItems: 1
          - type: 'null'
          examples:
          - tier=worker
          title: Label
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeWorkerCollectionResponse'
        '424':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Failed Dependency
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Cluster
      summary: Delete All Workers
      description: Delete all deployed PTX-Edge workers
      operationId: delete_all_workers_workers_delete
      parameters:
      - name: resource
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Resource
      - name: label
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            prefixItems:
            - type: string
              pattern: ^(.+)=(.+)$
            minItems: 1
            maxItems: 1
          - type: 'null'
          examples:
          - tier=worker
          title: Label
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeWorkerCollectionResponse'
        '424':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Failed Dependency
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    PEW-Input:
      properties:
        spec:
          $ref: '#/components/schemas/PEWSpec-Input'
        status:
          anyOf:
          - $ref: '#/components/schemas/PEWStatus'
          - type: 'null'
      type: object
      required:
      - spec
      title: PEW
    PEW-Output:
      properties:
        spec:
          $ref: '#/components/schemas/PEWSpec-Output'
        status:
          anyOf:
          - $ref: '#/components/schemas/PEWStatus'
          - type: 'null'
      type: object
      required:
      - spec
      title: PEW
    PEWSpec-Input:
      properties:
        service:
          anyOf:
          - $ref: '#/components/schemas/PEWSpecService'
          - type: 'null'
        data:
          $ref: '#/components/schemas/PEWSpecData-Input'
        worker:
          $ref: '#/components/schemas/PEWSpecWorker-Input'
        dataspace:
          anyOf:
          - $ref: '#/components/schemas/PEWSpecDataspace'
          - type: 'null'
      type: object
      required:
      - data
      - worker
      title: PEWSpec
      description: Specification of PTX Edge Worker
    PEWSpec-Output:
      properties:
        service:
          anyOf:
          - $ref: '#/components/schemas/PEWSpecService'
          - type: 'null'
        data:
          $ref: '#/components/schemas/PEWSpecData-Output'
        worker:
          $ref: '#/components/schemas/PEWSpecWorker-Output'
        dataspace:
          anyOf:
          - $ref: '#/components/schemas/PEWSpecDataspace'
          - type: 'null'
      type: object
      required:
      - data
      - worker
      title: PEWSpec
      description: Specification of PTX Edge Worker
    PEWSpecData-Input:
      properties:
        src:
          $ref: '#/components/schemas/PEWSpecDataSrc-Input'
        dst:
          anyOf:
          - $ref: '#/components/schemas/PEWSpecDataDst'
          - type: 'null'
      type: object
      required:
      - src
      title: PEWSpecData
      description: Data collection parameters
    PEWSpecData-Output:
      properties:
        src:
          $ref: '#/components/schemas/PEWSpecDataSrc-Output'
        dst:
          anyOf:
          - $ref: '#/components/schemas/PEWSpecDataDst'
          - type: 'null'
      type: object
      required:
      - src
      title: PEWSpecData
      description: Data collection parameters
    PEWSpecDataDst:
      properties:
        method:
          anyOf:
          - $ref: '#/components/schemas/PEWSpecDataDstMethod'
          - type: 'null'
          default: LOCAL
        path:
          anyOf:
          - type: string
            minLength: 1
            pattern: ^((/[a-zA-Z0-9-_\.]+)+)/?$
          - type: 'null'
          title: Path
          default: /var/cache/data
      type: object
      title: PEWSpecDataDst
      description: Data destination location
    PEWSpecDataDstMethod:
      type: string
      enum:
      - LOCAL
      title: PEWSpecDataDstMethod
      description: Data propagation scheme
    PEWSpecDataSrc-Input:
      properties:
        method:
          $ref: '#/components/schemas/PEWSpecDataSrcMethod'
          examples:
          - HTTPS
        path:
          anyOf:
          - type: string
            minLength: 1
            pattern: ^([a-zA-Z]+)://([^:/]+(:[0-9]{1,5})?)?(/[^/]+)*/?$
          - type: 'null'
          title: Path
          examples:
          - https://my.api.localhost:8080/data/example.csv
        size:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Size
          default: 100
        auth:
          anyOf:
          - $ref: '#/components/schemas/PEWSpecDataSrcAuth-Input'
          - type: 'null'
      type: object
      required:
      - method
      title: PEWSpecDataSrc
      description: Data source location
    PEWSpecDataSrc-Output:
      properties:
        method:
          $ref: '#/components/schemas/PEWSpecDataSrcMethod'
          examples:
          - HTTPS
        path:
          anyOf:
          - type: string
            minLength: 1
            pattern: ^([a-zA-Z]+)://([^:/]+(:[0-9]{1,5})?)?(/[^/]+)*/?$
          - type: 'null'
          title: Path
          examples:
          - https://my.api.localhost:8080/data/example.csv
        size:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Size
          default: 100
        auth:
          anyOf:
          - $ref: '#/components/schemas/PEWSpecDataSrcAuth-Output'
          - type: 'null'
      type: object
      required:
      - method
      title: PEWSpecDataSrc
      description: Data source location
    PEWSpecDataSrcAuth-Input:
      properties:
        scheme:
          $ref: '#/components/schemas/PEWSpecDataSrcAuthScheme'
          examples:
          - BASIC
        user:
          type: string
          minLength: 1
          title: User
          examples:
          - admin
        secret:
          type: string
          minLength: 1
          format: password
          title: Secret
          writeOnly: true
          examples:
          - myPasswd!007
        insecure:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Insecure
          default: false
      type: object
      required:
      - scheme
      - user
      - secret
      title: PEWSpecDataSrcAuth
      description: Authentication parameters for remote data collection
    PEWSpecDataSrcAuth-Output:
      properties:
        scheme:
          $ref: '#/components/schemas/PEWSpecDataSrcAuthScheme'
          examples:
          - BASIC
        user:
          type: string
          minLength: 1
          title: User
          examples:
          - admin
        secret:
          type: string
          minLength: 1
          title: Secret
          examples:
          - myPasswd!007
        insecure:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Insecure
          default: false
      type: object
      required:
      - scheme
      - user
      - secret
      title: PEWSpecDataSrcAuth
      description: Authentication parameters for remote data collection
    PEWSpecDataSrcAuthScheme:
      type: string
      enum:
      - BASIC
      - DIGEST
      - BEARER
      title: PEWSpecDataSrcAuthScheme
      description: Used authentication method
    PEWSpecDataSrcMethod:
      type: string
      enum:
      - FILE
      - DIR
      - HTTP
      - HTTPS
      - PTX
      - SKIP
      title: PEWSpecDataSrcMethod
      description: Data collection method
    PEWSpecDataspace:
      properties:
        exchange:
          anyOf:
          - $ref: '#/components/schemas/PEWSpecDataspaceExchange'
          - type: 'null'
        privacy:
          anyOf:
          - $ref: '#/components/schemas/PEWSpecDataspacePrivacy'
          - type: 'null'
      type: object
      title: PEWSpecDataspace
      description: PTX dataspace-related configuration
    PEWSpecDataspaceExchange:
      properties:
        data:
          anyOf:
          - $ref: '#/components/schemas/PEWSpecDataspaceExchangeData'
          - type: 'null'
        worker:
          anyOf:
          - $ref: '#/components/schemas/PEWSpecDataspaceExchangeWorker'
          - type: 'null'
      type: object
      title: PEWSpecDataspaceExchange
      description: Attributes of data exchange via PTX dataspace
    PEWSpecDataspaceExchangeData:
      properties:
        contract:
          type: string
          minLength: 1
          pattern: ^[0-9a-fA-F]+$
          title: Contract
          examples:
          - 66db1a6dc29e3ba863a85e0f
        provider:
          $ref: '#/components/schemas/PEWSpecDataspaceExchangeDataProvider'
        consumer:
          $ref: '#/components/schemas/PEWSpecDataspaceExchangeDataConsumer'
      type: object
      required:
      - contract
      - provider
      - consumer
      title: PEWSpecDataspaceExchangeData
      description: Dataspace contract information for data exchange
    PEWSpecDataspaceExchangeDataConsumer:
      properties:
        offer:
          type: string
          minLength: 1
          pattern: ^[0-9a-fA-F]+$
          title: Offer
          examples:
          - 66d18b79ee71f9f096baecb1
        resource:
          type: string
          minLength: 1
          pattern: ^[0-9a-fA-F]+$
          title: Resource
          examples:
          - 66d18bf6ee71f9f096baed58
      type: object
      required:
      - offer
      - resource
      title: PEWSpecDataspaceExchangeDataConsumer
      description: Data consumer configuration
    PEWSpecDataspaceExchangeDataProvider:
      properties:
        offer:
          type: string
          minLength: 1
          pattern: ^[0-9a-fA-F]+$
          title: Offer
          examples:
          - 66d187f4ee71f9f096bae8ca
        resource:
          type: string
          minLength: 1
          pattern: ^[0-9a-fA-F]+$
          title: Resource
          examples:
          - 66d1889cee71f9f096bae98b
      type: object
      required:
      - offer
      - resource
      title: PEWSpecDataspaceExchangeDataProvider
      description: Data provider configuration
    PEWSpecDataspaceExchangeWorker:
      properties:
        contract:
          type: string
          minLength: 1
          pattern: ^[0-9a-fA-F]+$
          title: Contract
          examples:
          - 66db1a6dc29e3ba863a85e0f
        provider:
          $ref: '#/components/schemas/PEWSpecDataspaceExchangeWorkerProvider'
        consumer:
          $ref: '#/components/schemas/PEWSpecDataspaceExchangeWorkerConsumer'
      type: object
      required:
      - contract
      - provider
      - consumer
      title: PEWSpecDataspaceExchangeWorker
      description: Dataspace contract information for worker exchange
    PEWSpecDataspaceExchangeWorkerConsumer:
      properties:
        offer:
          type: string
          minLength: 1
          pattern: ^[0-9a-fA-F]+$
          title: Offer
          examples:
          - 66d18b79ee71f9f096baecb1
        resource:
          type: string
          minLength: 1
          pattern: ^[0-9a-fA-F]+$
          title: Resource
          examples:
          - 66d18bf6ee71f9f096baed58
      type: object
      required:
      - offer
      - resource
      title: PEWSpecDataspaceExchangeWorkerConsumer
      description: Data consumer configuration
    PEWSpecDataspaceExchangeWorkerProvider:
      properties:
        offer:
          type: string
          minLength: 1
          pattern: ^[0-9a-fA-F]+$
          title: Offer
          examples:
          - 66d187f4ee71f9f096bae8ca
        resource:
          type: string
          minLength: 1
          pattern: ^[0-9a-fA-F]+$
          title: Resource
          examples:
          - 66d1889cee71f9f096bae98b
      type: object
      required:
      - offer
      - resource
      title: PEWSpecDataspaceExchangeWorkerProvider
      description: Data provider configuration
    PEWSpecDataspacePrivacy:
      properties:
        required:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Required
          default: true
        scheduler:
          anyOf:
          - $ref: '#/components/schemas/PEWSpecDataspacePrivacyScheduler'
          - type: 'null'
          default: PRIVATE
        zones:
          anyOf:
          - items:
              $ref: '#/components/schemas/PEWSpecDataspacePrivacyZone'
            type: array
            minItems: 1
          - type: 'null'
          title: Zones
      type: object
      title: PEWSpecDataspacePrivacy
      description: Privacy zone restriction policies
    PEWSpecDataspacePrivacyScheduler:
      type: string
      enum:
      - DEFAULT
      - PRIVATE
      title: PEWSpecDataspacePrivacyScheduler
      description: Used scheduling method
    PEWSpecDataspacePrivacyZone:
      properties:
        name:
          type: string
          minLength: 1
          title: Name
          examples:
          - zone-1
        preferred:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Preferred
          default: false
      type: object
      required:
      - name
      title: PEWSpecDataspacePrivacyZone
      description: Privacy zone
    PEWSpecService:
      properties:
        enabled:
          type: boolean
          title: Enabled
        interfaces:
          anyOf:
          - items:
              $ref: '#/components/schemas/PEWSpecServiceInterface'
            type: array
            minItems: 1
          - type: 'null'
          title: Interfaces
      type: object
      required:
      - enabled
      title: PEWSpecService
      description: Initiate worker as a service, not a single-executed task
    PEWSpecServiceInterface:
      properties:
        port:
          type: integer
          maximum: 65535.0
          minimum: 1.0
          title: Port
          examples:
          - 8080
        public:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Public
          default: false
        secured:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Secured
          default: true
        stripped:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Stripped
          default: true
        restricted:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Restricted
          default: false
      type: object
      required:
      - port
      title: PEWSpecServiceInterface
    PEWSpecWorker-Input:
      properties:
        src:
          $ref: '#/components/schemas/PEWSpecWorkerSrc-Input'
        dst:
          anyOf:
          - $ref: '#/components/schemas/PEWSpecWorkerDst'
          - type: 'null'
        command:
          anyOf:
          - items:
              $ref: '#/components/schemas/PEWSpecWorkerCommandItem'
            type: array
            minItems: 1
          - type: 'null'
          title: Command
          examples:
          - - /bin/sh
            - -c
            - sleep infinity
        demands:
          anyOf:
          - $ref: '#/components/schemas/PEWSpecWorkerDemands'
          - type: 'null'
        config:
          anyOf:
          - $ref: '#/components/schemas/PEWSpecWorkerConfig'
          - type: 'null'
      type: object
      required:
      - src
      title: PEWSpecWorker
      description: Worker environment parameters
    PEWSpecWorker-Output:
      properties:
        src:
          $ref: '#/components/schemas/PEWSpecWorkerSrc-Output'
        dst:
          anyOf:
          - $ref: '#/components/schemas/PEWSpecWorkerDst'
          - type: 'null'
        command:
          anyOf:
          - items:
              $ref: '#/components/schemas/PEWSpecWorkerCommandItem'
            type: array
            minItems: 1
          - type: 'null'
          title: Command
          examples:
          - - /bin/sh
            - -c
            - sleep infinity
        demands:
          anyOf:
          - $ref: '#/components/schemas/PEWSpecWorkerDemands'
          - type: 'null'
        config:
          anyOf:
          - $ref: '#/components/schemas/PEWSpecWorkerConfig'
          - type: 'null'
      type: object
      required:
      - src
      title: PEWSpecWorker
      description: Worker environment parameters
    PEWSpecWorkerCommandItem:
      type: string
      minLength: 1
      title: PEWSpecWorkerCommandItem
    PEWSpecWorkerConfig:
      properties:
        file:
          anyOf:
          - items:
              $ref: '#/components/schemas/PEWSpecWorkerConfigFileItem'
            type: array
            minItems: 1
          - type: 'null'
          title: File
        env:
          anyOf:
          - items:
              $ref: '#/components/schemas/PEWSpecWorkerConfigEnvItem'
            type: array
            minItems: 1
          - type: 'null'
          title: Env
      type: object
      title: PEWSpecWorkerConfig
      description: Worker image configuration parameters
    PEWSpecWorkerConfigEnvItem:
      properties:
        key:
          type: string
          minLength: 1
          title: Key
          examples:
          - MY_CFG_ENVVAR
        value:
          anyOf:
          - type: string
          - type: 'null'
          title: Value
          examples:
          - '42'
      type: object
      required:
      - key
      title: PEWSpecWorkerConfigEnvItem
      description: Key-value pairs
    PEWSpecWorkerConfigFileItem:
      properties:
        path:
          type: string
          minLength: 1
          pattern: ^((/[a-zA-Z0-9-_\.]+)+)$
          title: Path
          examples:
          - /var/cache/worker/cfg.ini
        data:
          type: string
          title: Data
