openapi: 3.1.0
info:
  title: PTX Edge Computing REST-API
  description: The Edge Computing (Decentralized AI processing) BB-02 provides value-added
    services exploiting an underlying distributed edge computing infrastructure.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
  x-creation-date: '2026-10-23T22:11:22'
servers:
- url: /
  description: PTX Edge Computing
paths:
  /version:
    get:
      tags:
      - Internal
      summary: Get Versions
      description: Versions of the REST-API component
      operationId: get_versions_version_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionsResponse'
  /health:
    get:
      tags:
      - Internal
      summary: Health
      description: For health check purposes
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
    head:
      tags:
      - Internal
      summary: Health
      description: For health check purposes
      operationId: health_health_head
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /workers/{name}:
    get:
      tags:
      - Edge-Worker
      summary: Get Worker By Name
      description: Obtain deployed PTX-Edge worker with given name
      operationId: get_worker_by_name_workers__name__get
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
          description: Worker name
          example: worker
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PEW-Output'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Not Found
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Bad Gateway
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Edge-Worker
      summary: Recreate Worker With Name
      description: Re-create PTX-Edge worker with given name
      operationId: recreate_worker_with_name_workers__name__put
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
          description: Worker name
          example: worker
          title: Name
      - name: label
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              pattern: ^(.+)=(.+){1,63}$
          - type: 'null'
          examples:
          - tier=worker
          title: Label
      - name: tolerance
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Grace period
          default: 10
          title: Tolerance
        description: Grace period
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PEW-Input'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeWorkerResponse'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Unprocessable Content
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Bad Gateway
    delete:
      tags:
      - Edge-Worker
      summary: Delete Worker By Name
      description: Delete PTX-Edge worker with given name
      operationId: delete_worker_by_name_workers__name__delete
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
          description: Worker name
          example: worker
          title: Name
      - name: tolerance
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Grace period
          default: 10
          title: Tolerance
        description: Grace period
      - name: wait
        in: query
        required: false
        schema:
          type: boolean
          description: Should wait for complete deletion
          default: false
          title: Wait
        description: Should wait for complete deletion
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeWorkerResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Not Found
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Bad Gateway
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workers/{name}/status:
    get:
      tags:
      - Edge-Worker
      summary: Get Worker Status
      description: Obtain deployed PTX-Edge worker with given name
      operationId: get_worker_status_workers__name__status_get
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
          description: Worker name
          example: worker
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PEWStatus'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Not Found
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Bad Gateway
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workers/{name}/endpoints:
    get:
      tags:
      - Edge-Worker
      summary: Get Worker Endpoints
      description: Obtain deployed PTX-Edge worker with given name
      operationId: get_worker_endpoints_workers__name__endpoints_get
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
          description: Worker name
          example: worker
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PTXEdgeWorkerEndpoint'
                title: Response Get Worker Endpoints Workers  Name  Endpoints Get
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Not Found
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Bad Gateway
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workers/{name}/watcher:
    get:
      tags:
      - Edge-Worker
      summary: Watch Worker Status
      description: Obtain deployed PTX-Edge worker with given name
      operationId: watch_worker_status_workers__name__watcher_get
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
          description: Worker name
          example: worker
          title: Name
      - name: state
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PTXEdgeWorkerState'
          description: Watched worker state
          default: ready
        description: Watched worker state
      - name: timeout
        in: query
        required: false
        schema:
          type: integer
          exclusiveMinimum: 0
          default: 30
          title: Timeout
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeWorkerCollectionResponseStatus'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Not Found
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Bad Gateway
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workers:
    post:
      tags:
      - Edge-Worker
      summary: Create Worker
      description: Create PTX-Edge worker with an autogenerated or implicitly-defined
        name
      operationId: create_worker_workers_post
      parameters:
      - name: label
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              pattern: ^(.+)=(.+){1,63}$
          - type: 'null'
          examples:
          - tier=worker
          title: Label
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PEW-Input'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeWorkerResponse'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Unprocessable Content
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Conflict
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Bad Gateway
    get:
      tags:
      - Cluster
      summary: List All Workers
      description: Obtain deployed PTX-Edge worker states and resources
      operationId: list_all_workers_workers_get
      parameters:
      - name: resource
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Resource
      - name: label
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              pattern: ^(.+)=(.+){1,63}$
          - type: 'null'
          examples:
          - tier=worker
          title: Label
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeWorkerCollectionResponse'
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Bad Gateway
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Cluster
      summary: Delete All Workers
      description: Delete all deployed PTX-Edge workers filtered by optional labels
      operationId: delete_all_workers_workers_delete
      parameters:
      - name: resource
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Resource
      - name: label
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              pattern: ^(.+)=(.+){1,63}$
          - type: 'null'
          examples:
          - tier=worker
          title: Label
      - name: tolerance
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Grace period
          default: 10
          title: Tolerance
        description: Grace period
      - name: wait
        in: query
        required: false
        schema:
          type: boolean
          description: Should wait for complete deletion
          default: false
          title: Wait
        description: Should wait for complete deletion
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeWorkerCollectionResponse'
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Bad Gateway
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workers/batch:
    post:
      tags:
      - Edge-Worker
      summary: Create Worker Batch
      description: Create batch of named PTX-Edge workers
      operationId: create_worker_batch_workers_batch_post
      parameters:
      - name: parallel
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Parallel
      - name: wait
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Wait
      - name: timeout
        in: query
        required: false
        schema:
          type: integer
          exclusiveMinimum: 0
          default: 30
          title: Timeout
      - name: label
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              pattern: ^(.+)=(.+){1,63}$
          - type: 'null'
          examples:
          - tier=worker
          title: Label
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PEW-Input'
              title: Pews
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PTXEdgeWorkerResponse'
                title: Response Create Worker Batch Workers Batch Post
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Unprocessable Content
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Conflict
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Bad Gateway
  /adapters/infra:
    post:
      tags:
      - Adapter
      summary: Create Workers Via Infra Service
      description: Infrastructure service endpoint for creating worker batch synchronously
        by Service Chain Adapter
      operationId: create_workers_via_infra_service_adapters_infra_post
      parameters:
      - name: parallel
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Parallel
      - name: wait
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Wait
      - name: label
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              pattern: ^(.+)=(.+){1,63}$
          - type: 'null'
          examples:
          - tier=worker
          title: Label
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PTXServiceChainInfraRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXServiceChainInfraResponse'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Unprocessable Content
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Conflict
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Bad Gateway
  /adapters/infra/tasks:
    post:
      tags:
      - Adapter
      summary: Schedule Workers Via Infra Service
      description: Infrastructure service endpoint for creating worker batch asynchronously
      operationId: schedule_workers_via_infra_service_adapters_infra_tasks_post
      parameters:
      - name: timeout
        in: query
        required: false
        schema:
          type: integer
          exclusiveMinimum: 0
          default: 30
          title: Timeout
      - name: label
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              pattern: ^(.+)=(.+){1,63}$
          - type: 'null'
          examples:
          - tier=worker
          title: Label
      - name: x-ptx-service-chain-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: ID generated by the Data Processing Chain library
          title: X Ptx Service Chain Id
        description: ID generated by the Data Processing Chain library
      - name: x-ptx-target-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Current resource being processed
          title: X Ptx Target Id
        description: Current resource being processed
      - name: x-ptx-contracturl
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Full URL with the ID of the current contract being used
          title: X Ptx Contracturl
        description: Full URL with the ID of the current contract being used
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PTXServiceChainInfraRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Unprocessable Content
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Conflict
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTXEdgeAPIError'
          description: Bad Gateway
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    PEW-Input:
      properties:
        spec:
          $ref: '#/components/schemas/PEWSpec-Input'
        status:
          anyOf:
          - $ref: '#/components/schemas/PEWStatus'
          - type: 'null'
      type: object
      required:
      - spec
      title: PEW
    PEW-Output:
      properties:
        spec:
          $ref: '#/components/schemas/PEWSpec-Output'
        status:
          anyOf:
          - $ref: '#/components/schemas/PEWStatus'
          - type: 'null'
      type: object
      required:
      - spec
      title: PEW
    PEWSpec-Input:
      properties:
        name:
          anyOf:
          - type: string
            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
          - type: 'null'
          title: Name
          examples:
          - worker-123
        service:
          anyOf:
          - $ref: '#/components/schemas/PEWSpecService'
          - type: 'null'
        data:
          $ref: '#/components/schemas/PEWSpecData-Input'
        worker:
          $ref: '#/components/schemas/PEWSpecWorker-Input'
        dataspace:
          anyOf:
          - $ref: '#/components/schemas/PEWSpecDataspace'
          - type: 'null'
      type: object
      required:
      - data
      - worker
      title: PEWSpec
      description: Specification of PTX Edge Worker
    PEWSpec-Output:
      properties:
        name:
          anyOf:
          - type: string
            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
          - type: 'null'
          title: Name
          examples:
          - worker-123
        service:
          anyOf:
          - $ref: '#/components/schemas/PEWSpecService'
          - type: 'null'
        data:
          $ref: '#/components/schemas/PEWSpecData-Output'
        worker:
          $ref: '#/components/schemas/PEWSpecWorker-Output'
        dataspace:
          anyOf:
          - $ref: '#/components/schemas/PEWSpecDataspace'
          - type: 'null'
      type: object
      required:
      - data
      - worker
      title: PEWSpec
      description: Specification of PTX Edge Worker
    PEWSpecData-Input:
      properties:
        src:
          $ref: '#/components/schemas/PEWSpecDataSrc-Input'
        dst:
          anyOf:
          - $ref: '#/components/schemas/PEWSpecDataDst'
          - type: 'null'
      type: object
      required:
      - src
      title: PEWSpecData
      description: Data collection parameters
    PEWSpecData-Output:
      properties:
        src:
          $ref: '#/components/schemas/PEWSpecDataSrc-Output'
        dst:
          anyOf:
          - $ref: '#/components/schemas/PEWSpecDataDst'
          - type: 'null'
      type: object
      required:
      - src
      title: PEWSpecData
      description: Data collection parameters
    PEWSpecDataDst:
      properties:
        method:
          anyOf:
          - $ref: '#/components/schemas/PEWSpecDataDstMethod'
          - type: 'null'
          default: LOCAL
        path:
          anyOf:
          - type: string
            minLength: 1
            pattern: ^((/[a-zA-Z0-9-_\.]+)+)/?$
          - type: 'null'
          title: Path
          default: /var/cache/data
      type: object
      title: PEWSpecDataDst
      description: Data destination location
    PEWSpecDataDstMethod:
      type: string
      enum:
      - LOCAL
      title: PEWSpecDataDstMethod
      description: Data propagation scheme
    PEWSpecDataSrc-Input:
      properties:
        method:
          $ref: '#/components/schemas/PEWSpecDataSrcMethod'
          examples:
          - HTTPS
        path:
          anyOf:
          - type: string
            minLength: 1
            pattern: ^([a-zA-Z]+)://([^:/]+(:[0-9]{1,5})?)?(/[^/]+)*/?$
          - type: 'null'
          title: Path
          examples:
          - https://my.api.localhost:8080/data/example.csv
        size:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Size
          default: 100
        auth:
          anyOf:
          - $ref: '#/components/schemas/PEWSpecDataSrcAuth-Input'
          - type: 'null'
      type: object
      required:
      - method
      title: PEWSpecDataSrc
      description: Data source location
    PEWSpecDataSrc-Output:
      properties:
        method:
          $ref: '#/components/schemas/PEWSpecDataSrcMethod'
          examples:
          - HTTPS
        path:
          anyOf:
          - type: string
            minLength: 1
            pattern: ^([a-zA-Z]+)://([^:/]+(:[0-9]{1,5})?)?(/[^/]+)*/?$
          - type: 'null'
          title: Path
          examples:
          - https://my.api.localhost:8080/data/example.csv
        size:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Size
          default: 100
        auth:
          anyOf:
          - $ref: '#/components/schemas/PEWSpecDataSrcAuth-Output'
          - type: 'null'
      type: object
      required:
      - method
      title: PEWSpecDataSrc
      description: Data source location
    PEWSpecDataSrcAuth-Input:
      properties:
        scheme:
          $ref: '#/components/schemas/PEWSpecDataSrcAuthScheme'
          examples:
          - BASIC
        user:
          type: string
          minLength: 1
          title: User
          examples:
          - admin
        secret:
          type: string
          minLength: 1
          format: password
          title: Secret
          writeOnly: true
          examples:
          - myPasswd!007
        insecure:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Insecure
          default: false
      type: object
