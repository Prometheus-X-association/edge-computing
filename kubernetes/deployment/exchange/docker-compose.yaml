include:
  - basic-infra.yaml

services:
  # Main datasource API serving data with different extensions and authentication
  api-provider:
    container_name: api-provider
    image: busybox:latest
    restart: no # fail fast
    init: true
    user: 1001:1001
    security_opt:
      - no-new-privileges:true
    entrypoint: /usr/app/entrypoint.sh
    working_dir: /usr/src/app/static
    command: [ 'httpd', '-vv', '-f', '-p', '0.0.0.0:8080', '-h', './', '-r', 'Provider API' ]
    configs:
      - source: provider-server-wrapper.sh
        target: /usr/app/entrypoint.sh
        mode: 0555
      - source: cfg-httpd.conf
        target: /etc/httpd.conf
      - source: cfg-hz
        target: /usr/src/app/static/healthz
      - source: dp0.json
        target: /usr/src/app/static/dp0.json
      - source: dp0-data.csv
        target: /usr/src/app/static/dp0/data.csv
    networks:
      - nw-provider
    deploy:
      resources:
        limits:
          cpus: 1.0
          memory: 100m
    healthcheck:
      test: [ 'CMD', 'wget', '--spider', '-q', 'http://localhost:8080/healthz' ]
      start_period: 5s
      interval: 5m
    depends_on:
      ngrok-tunnel:
        condition: service_healthy

  # Main API accepting any GET/POST and returning static JSON
  api-provider-status:
    container_name: api-provider-status
    image: busybox:latest
    restart: no # fail fast
    user: 1001:1001
    security_opt:
      - no-new-privileges:true
    configs:
      - source: provider-status-server.sh
        target: /usr/app/entrypoint.sh
        mode: 0555
    entrypoint: /usr/app/entrypoint.sh
    networks:
      - nw-provider
    deploy:
      resources:
        limits:
          cpus: 1.0
          memory: 100m
    healthcheck:
      test: [ 'CMD', 'wget', '--spider', '-q', 'http://localhost:8080/healthz' ]
      start_period: 5s
      interval: 5m
    depends_on:
      api-provider:
        condition: service_healthy

  # Main Infrastructure API at Provider side
  api-infrastructure:
    container_name: api-infrastructure
    image: alpine/webhook:latest
    pull_policy: never
    user: 1001:1001
    security_opt:
      - no-new-privileges:true
    build:
      context: .
      dockerfile_inline: |
        FROM alpine:latest
        RUN apk --no-cache add jo webhook
    restart: no # fail fast
    configs:
      - source: infra-hooks.yaml
        target: /usr/webhook/hooks.yaml
      - source: infra-async-handler.yaml
        target: /usr/webhook/infra-handler.sh
        mode: 0555
    command: [ "webhook", "-verbose", "-port=8080", "-http-methods=GET,POST", "-hooks=/usr/webhook/hooks.yaml" ]
    networks:
      - nw-provider
      - nw-consumer
    deploy:
      resources:
        limits:
          cpus: 1.0
          memory: 100m
    healthcheck:
      test: [ 'CMD', 'wget', '--spider', '-q', 'http://localhost:8080/hooks/healthz' ]
      start_period: 5s
      interval: 5m
    depends_on:
      ngrok-tunnel:
        condition: service_healthy
      api-provider:
        condition: service_healthy

  #  # Main Infrastructure consumer API
  #  api-consumer-infra:
  #    container_name: api-consumer-infra
  #    image: traefik/whoami:latest
  #    restart: no # fail fast
  #    user: 1001:1001
  #    security_opt:
  #      - no-new-privileges:true
  #    environment:
  #      WHOAMI_NAME: infrastructure-service
  #      WHOAMI_PORT_NUMBER: 8080
  #    command: [ "--verbose" ]
  #    networks:
  #      - nw-consumer
  #    deploy:
  #      resources:
  #        limits:
  #          cpus: 1.0
  #          memory: 100m
  #    healthcheck:
  #      test: [ 'CMD', 'wget', '--spider', '-q', 'http://localhost:8080/health' ]
  #      start_period: 5s
  #      interval: 5m
  #    depends_on:
  #      pdc-consumer:
  #        condition: service_healthy

  ######################################################################################################################

  # Main data consumer API accepting any callbacks and returning static JSON
  api-consumer:
    container_name: api-consumer
    image: busybox:latest
    restart: no # fail fast
    user: 1001:1001
    security_opt:
      - no-new-privileges:true
    entrypoint: /usr/app/entrypoint.sh
    configs:
      - source: consumer-server.sh
        target: /usr/app/entrypoint.sh
        mode: 0555
    networks:
      - nw-consumer
    deploy:
      resources:
        limits:
          cpus: 1.0
          memory: 100m
    healthcheck:
      test: [ 'CMD', 'wget', '--spider', '-q', 'http://localhost:8080/healthz' ]
      start_period: 5s
      interval: 5m
    depends_on:
      ngrok-tunnel:
        condition: service_healthy
      api-provider:
        condition: service_healthy

########################################################################################################################

configs:
  # Provider API config
  cfg-hz:
    content: "OK"

  # - set proper mime type for non-HTML responses
  # - set basic authentication for specific path
  cfg-httpd.conf:
    content: |
      .json:application/json;charset=utf-8
      .csv:text/csv;charset=utf-8
      /dp0/:admin:admin

  # Dataset and resource descriptor for provider (Datasource)
  dp0.json:
    content: '{"type": "REST", "content": {"url": "http://provider-api:8080/dp0/data.csv"}}'

  dp0-data.csv:
    content: |
      Name,Age,Department
      Alice,30,Engineering
      Bob,25,Marketing
      Charlie,35,Sales

  # Simple consumer API config
  provider-server-wrapper.sh:
    content: |
      #!/usr/bin/env sh
      trap "echo 'Caught stop signal! Exiting...'; exit 0;" INT TERM
      "$@" &
      wait $${!}

  # Simple consumer API config
  provider-status-server.sh:
    content: |
      #!/usr/bin/env sh
      trap "echo 'Caught stop signal! Exiting...'; exit 0;" INT TERM
      while true; do
        echo -e '\n\nWaiting for webhooks...'
        printf 'HTTP/1.1 200 OK\r\n\r\n%s\n' | nc -vnl -p 8080 &
        wait $${!}
      done

  # Simple consumer API config
  consumer-server.sh:
    content: |
      #!/usr/bin/env sh
      trap "echo 'Caught stop signal! Exiting...'; exit 0;" INT TERM
      while true; do
        echo -e '\n\nWaiting for connections...'
        body="{ \"timestamp\": \"$$(date +%s)\", \"participant\": \"CONSUMER\", \"status\": \"OK\" }"
        len="$$(printf '%s\n' "$${body}" | wc -c)"
        resp='HTTP/1.1 200 OK\r\nContent-Type: application/json\r\nContent-Length: %s\r\n\r\n%s\n'
        printf "$${resp}" "$${len}" "$${body}" | nc -vnl -p 8080 &
        wait $!
      done

  # Define webhooks and bind handler scripts
  infra-hooks.yaml:
    content: |
      # Healthcheck
      - id: healthz
        execute-command: "true"
      # Infra webhook with service chain adapter
      - id: infra/sync
        execute-command: jo
        include-command-output-in-response: true
        pass-arguments-to-command:
          - source: string
            name: "participant=INFRA"
          - source: string
            name: "mode=sync"
          - source: string
            name: "status=Processed"
        response-headers:
          - name: Content-Type
            value: application/json;charset=utf-8
        ### Debugging purposes
        pass-environment-to-command:
          - source: entire-payload
            envname: PAYLOAD
      # Asynchronous Infra webhook
      - id: infra/async
        execute-command: /usr/webhook/infra-handler.sh
        pass-environment-to-command:
          - source: string
            name: http://pdc-provider:3000/node/communicate/resume
            envname: PDC_URL
          - source: header
            name: x-ptx-service-chain-id
            envname: CHAIN_ID
          - source: header
            name: x-ptx-target-id
            envname: TARGET_ID
          - source: payload
            name: data
            envname: HOOK_DATA
          - source: payload
            name: params
            envname: HOOK_PARAMS
          ### Debugging purposes
          - source: entire-payload
            envname: PAYLOAD
          - source: entire-headers
            envname: HEADERS
        response-message: '{"participant":"INFRA","mode":"async","status":"Processing"}'
        response-headers:
          - name: Content-Type
            value: application/json;charset=utf-8

  infra-async-handler.yaml:
    content: |
      #!/usr/bin/env sh
      # Verbose 
      echo -e "\n\nReceived headers: $${HEADERS}"
      echo -e "\nReceived payload: $${PAYLOAD}"
      # Simulating async processing
      sleep 3s
      # Resuming
      CB_BODY="$$(jo chainId=$${CHAIN_ID} targetId=$${TARGET_ID} data=$${HOOK_DATA} params=$${HOOK_PARAMS})"
      echo -e "\nAssembled callback body: $${CB_BODY}\nInvoking callback for resuming service chain processing..."
      wget -S -T5 -O- --header "Content-Type: application/json;charset=utf-8" --post-data "$${CB_BODY}" $${PDC_URL}