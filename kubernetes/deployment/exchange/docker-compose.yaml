name: exchange
services:
  # Shared DB for PDC instances
  mongodb:
    container_name: mongodb
    image: mongo:latest
    restart: no # fail fast
    labels:
      setup: exchange
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    configs:
      - source: cfg-mongo-init.js
        target: /docker-entrypoint-initdb.d/mongo-init.js
        mode: 0444
    volumes:
      - vol-mongo:/data/db
    networks:
      - nw-mongo
    healthcheck:
      test: [ 'CMD', 'mongosh', '-u=admin', '-p=admin', '--authenticationDatabase=admin', "--eval=db.adminCommand('ping')" ]
      start_period: 15s
      interval: 1m

  ########################################################################################################################

  # PDC instances
  pdc-provider:
    container_name: pdc-provider
    image: dataspace-connector:latest
    pull_policy: never
    restart: no # fail fast
    #stop_signal: SIGKILL
    init: true  # handle signals
    labels:
      setup: exchange
    environment:
      MONGO_URI: mongodb://pdc:pdc@mongodb:27017/pdc-provider?authSource=pdc-provider&appName=pdc-provider
    configs:
      - source: cfg-pdc-provider.json
        target: /usr/src/app/src/config.json
      - source: cfg-pdc-provider.env
        target: /usr/src/app/.env
    networks:
      - nw-mongo
      - nw-provider
    healthcheck:
      test: [ 'CMD', 'curl', '-o', '/dev/null', '-SsfI', 'http://localhost:3000' ]
      start_period: 15s
      interval: 1m
    depends_on:
      mongodb:
        condition: service_healthy

  pdc-consumer:
    container_name: pdc-consumer
    image: dataspace-connector:latest
    pull_policy: never
    restart: no # fail fast
    #stop_signal: SIGKILL
    init: true # handle signals
    labels:
      setup: exchange
    environment:
      MONGO_URI: mongodb://pdc:pdc@mongodb:27017/pdc-consumer?authSource=pdc-consumer&appName=pdc-consumer
    configs:
      - source: cfg-pdc-consumer.json
        target: /usr/src/app/src/config.json
      - source: cfg-pdc-consumer.env
        target: /usr/src/app/.env
    networks:
      - nw-mongo
      - nw-consumer
    healthcheck:
      test: [ 'CMD', 'curl', '-o', '/dev/null', '-SsfI', 'http://localhost:3000' ]
      start_period: 15s
      interval: 1m
    depends_on:
      mongodb:
        condition: service_healthy

  ########################################################################################################################

  # Reverse HTTP(S) tunnels to local PDC instances
  ngrok-tun-provider:
    container_name: ngrok-tun-provider
    image: ngrok/ngrok:latest
    restart: no # fail fast
    labels:
      setup: exchange
    environment:
      NGROK_AUTHTOKEN: ${DS_NGROK_AUTHTOKEN:?}
    command: [ 'http', "--url=${DS_NGROK_DOMAIN:?}", '--log=stdout', 'pdc-provider:3000' ]
    ports:
      - "4041:4040" # debug web interface
    networks:
      - nw-provider
    healthcheck:
      test: [ 'CMD-SHELL', 'ngrok diagnose >/dev/null' ]
      start_period: 10s
      interval: 3m
    depends_on:
      pdc-provider:
        condition: service_healthy

  ngrok-tun-consumer:
    container_name: ngrok-tun-consumer
    image: ngrok/ngrok:latest
    restart: no # fail fast
    labels:
      setup: exchange
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?}
    command: [ 'http', "--url=${NGROK_DOMAIN:?}", '--log=stdout', 'pdc-consumer:3000' ]
    ports:
      - "4042:4040" # debug web interface
    networks:
      - nw-consumer
    healthcheck:
      test: [ 'CMD-SHELL', 'ngrok diagnose >/dev/null' ]
      start_period: 10s
      interval: 3m
    depends_on:
      pdc-consumer:
        condition: service_healthy

  ########################################################################################################################

  # Main datasource API serving data
  api-provider:
    container_name: api-provider
    image: busybox:latest
    #image: joseluisq/static-web-server:2
    restart: no # fail fast
    labels:
      setup: exchange
    init: true
    working_dir: /usr/src/app/static
    command: [ 'httpd', '-vv', '-f', '-u', '1001:1001', '-p', '0.0.0.0:8080', '-h', './', '-r', 'Provider API' ]
    #command: [ 'python3.14', '-m', 'http.server', '-b', '0.0.0.0', '-d', '/usr/src/app/static/', '8080' ]
    #command: [ '-a=0.0.0.0', '-p=8080', '-d=/usr/src/app/static/', '-g=info', '--log-remote-address' ]
    configs:
      - source: cfg-httpd.conf
        target: /etc/httpd.conf
      - source: cfg-hz
        target: /usr/src/app/static/healthz
      - source: dp0.json
        target: /usr/src/app/static/dp0.json
        uid: '1001'
        gid: '1001'
        mode: 0444
      - source: dp0-data.csv
        target: /usr/src/app/static/dp0/data.csv
        uid: '1001'
        gid: '1001'
        mode: 0444
    networks:
      - nw-provider
    healthcheck:
      test: [ 'CMD', 'wget', '--spider', '-q', 'http://localhost:8080/healthz' ]
      start_period: 5s
      interval: 3m
    depends_on:
      pdc-provider:
        condition: service_healthy

  # Main data consumer API accepting PDC callbacks
  #  api-consumer:
  #    container_name: api-consumer
  #    image: traefik/whoami:latest
  #    restart: no # fail fast
  #    labels:
  #      setup: exchange
  #    command: [ '--port=8080', '--name=consumer', '--verbose' ]
  #    networks:
  #      - nw-consumer
  #    depends_on:
  #      pdc-consumer:
  #        condition: service_healthy

  api-consumer:
    container_name: api-consumer
    image: busybox:latest
    restart: no # fail fast
    labels:
      setup: exchange
    configs:
      - source: consumer-server.sh
        target: /usr/app/entrypoint.sh
        mode: 0555
    entrypoint: /usr/app/entrypoint.sh
    stop_signal: SIGKILL
    networks:
      - nw-consumer
    depends_on:
      pdc-consumer:
        condition: service_healthy

  ########################################################################################################################

  # Additional packet profilers
  sniffer-provider:
    container_name: sniffer-provider
    image: alpine/tshark:latest
    pull_policy: never
    build:
      dockerfile_inline: |
        FROM alpine:latest
        RUN apk --no-cache add tshark
    restart: no # fail fast
    cap_add:
      - NET_RAW
      - NET_ADMIN
    labels:
      setup: exchange
    command: [ 'tshark', '-i', 'eth0', '-Y', 'http', '-O', 'http', '-V' ]
    network_mode: service:api-provider
    depends_on:
      - api-provider
    profiles:
      - extra

  sniffer-consumer:
    container_name: sniffer-consumer
    image: alpine/tshark:latest
    pull_policy: never
    build:
      additional_contexts:
        alpine/tshark: "service:sniffer-provider"
    restart: no # fail fast
    cap_add:
      - NET_RAW
      - NET_ADMIN
    labels:
      setup: exchange
    command: [ 'tshark', '-i', 'eth0', '-Y', 'http', '-O', 'http', '-V' ]
    network_mode: service:api-consumer
    depends_on:
      - api-consumer
    profiles:
      - extra

########################################################################################################################

configs:
  # Define users for PDC's own collection
  cfg-mongo-init.js:
    content: |
      db.getSiblingDB('pdc-provider').createUser({
        user: 'pdc',
        pwd: 'pdc',
        roles: [{ role: 'readWrite',
                    db: 'pdc-provider' }]
      });
      db.getSiblingDB('pdc-consumer').createUser({
        user: 'pdc',
        pwd: 'pdc',
        roles: [{ role: 'readWrite', 
                    db: 'pdc-consumer' }]
      });

  # Define provider PDC's main configuration
  cfg-pdc-provider.json:
    content: |
      {
        "endpoint": "https://${DS_NGROK_DOMAIN:?}",
        "serviceKey": "${DS_PDC_SERVICE_KEY:?}",
        "secretKey": "${DS_PDC_SECRET_KEY:?}",
        "catalogUri": "https://api.visionstrust.com/v1/",
        "contractUri": "https://contract.visionstrust.com/",
        "consentUri": "https://consent.visionstrust.com/v1",
        "credentials": [
          {
            "_id": "test-auth-basic",
            "type": "api-key",
            "key": "Authorization",
            "value": "Basic YWRtaW46YWRtaW4="
          }
        ],
        "expressLimitSize": "10mb",
        "serviceChainAdapter": false,
        "serviceChainAdapterTimeout": 3000
      }
  cfg-pdc-provider.env:
    content: |
      NODE_ENV=production
      PORT=3000
      SESSION_SECRET=6OEVPVF73INhElUq
      SESSION_COOKIE_EXPIRATION=24000
      WINSTON_LOGS_MAX_FILES=1d
      WINSTON_LOGS_MAX_SIZE=20m
      JWT_BEARER_TOKEN_EXPIRATION=1h
      JWT_REFRESH_TOKEN_EXPIRATION=3h
      EXCHANGE_TRIGGER_API_KEY=${DS_PDC_EXCHANGE_TRIGGER_API_KEY:-}
      EXCHANGE_TIMEOUT=60

  # Define consumer PDC's main configuration
  cfg-pdc-consumer.json:
    content: |
      {
        "endpoint": "https://${NGROK_DOMAIN:?}",
        "serviceKey": "${PDC_SERVICE_KEY:?}",
        "secretKey": "${PDC_SECRET_KEY:?}",
        "catalogUri": "https://api.visionstrust.com/v1/",
        "contractUri": "https://contract.visionstrust.com/",
        "consentUri": "https://consent.visionstrust.com/v1",
        "credentials": [],
        "expressLimitSize": "10mb",
        "serviceChainAdapter": false,
        "serviceChainAdapterTimeout": 3000
      }
  cfg-pdc-consumer.env:
    content: |
      NODE_ENV=production
      PORT=3000
      SESSION_SECRET=6OEVPVF73INhElUq
      SESSION_COOKIE_EXPIRATION=24000
      WINSTON_LOGS_MAX_FILES=14d
      WINSTON_LOGS_MAX_SIZE=20m
      JWT_BEARER_TOKEN_EXPIRATION=1h
      JWT_REFRESH_TOKEN_EXPIRATION=3h
      EXCHANGE_TRIGGER_API_KEY=${PDC_EXCHANGE_TRIGGER_API_KEY:-}
      EXCHANGE_TIMEOUT=60

  # Provider API config
  cfg-hz:
    content: "OK"
  # - set proper mime type for non-HTML responses
  # - set basic authentication for specific path
  cfg-httpd.conf:
    content: |
      .json:application/json;charset=utf-8
      .csv:text/csv;charset=utf-8
      /dp0/:admin:admin
  # Dataset and resource descriptor for provider (Datasource)
  dp0.json:
    content: |
      {
        "type": "REST",
        "content": {
          "url": "http://provider-api:8080/dp0/data.csv",
          "auth": {
            "scheme": "http",
            "user": "",
            "secret": "",
            "insecure": false,
          }
        }
      }
  dp0-data.csv:
    content: |
      Name,Age,Department
      Alice,30,Engineering
      Bob,25,Marketing
      Charlie,35,Sales

  # Consumer API config
  consumer-server.sh:
    content: |
      #!/usr/bin/env sh
      while true; do
        printf '\nWaiting for connections...'
        body="{\"timestamp\": \"$$(date +%s)\", \"code\": 200, \"status\": \"OK\"}\n";
        len="$$(printf '%s' "$${body}" | wc -c)";
        resp='HTTP/1.1 200 OK\r\nContent-Type: application/json\r\nContent-Length: %s\r\n\r\n%s\n'
        printf "$${resp}" "$${len}" "$${body}" | nc -vnl -p 8080;
      done

########################################################################################################################

volumes:
  # Persisted db volume
  vol-mongo:
    external: false

########################################################################################################################

networks:
  # MongoDB local network without external access
  nw-mongo:
    internal: true
  # Participants' local networks
  nw-provider: { }
  nw-consumer: { }