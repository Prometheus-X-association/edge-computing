include:
  - basic-infra.yaml

services:
  # Main datasource API serving data with different extensions and authentication
  api-provider:
    container_name: api-provider
    image: busybox:latest
    restart: no # fail fast
    init: true
    user: 1001:1001
    security_opt:
      - no-new-privileges:true
    configs:
      - source: provider-server-wrapper.sh
        target: /usr/app/entrypoint.sh
        mode: 0555
      - source: cfg-httpd.conf
        target: /etc/httpd.conf
      - source: cfg-hz
        target: /usr/src/app/static/healthz
      - source: dp0.json
        target: /usr/src/app/static/dp0.json
      - source: dp0-data.csv
        target: /usr/src/app/static/dp0/data.csv
    entrypoint: /usr/app/entrypoint.sh
    working_dir: /usr/src/app/static
    command: [ 'httpd', '-vv', '-f', '-p', '0.0.0.0:8080', '-h', './', '-r', 'Provider API' ]
    networks:
      - nw-provider
    deploy:
      resources:
        limits:
          cpus: 1.0
          memory: 100m
    healthcheck:
      test: [ 'CMD', 'wget', '--spider', '-q', 'http://localhost:8080/healthz' ]
      start_period: 5s
      interval: 5m
    depends_on:
      ngrok-tunnel:
        condition: service_healthy

  # Main API accepting any GET/POST and returning static JSON
  api-provider-status:
    container_name: api-provider-status
    image: busybox:latest
    restart: no # fail fast
    user: 1001:1001
    security_opt:
      - no-new-privileges:true
    configs:
      - source: provider-status-server.sh
        target: /usr/app/entrypoint.sh
        mode: 0555
    entrypoint: /usr/app/entrypoint.sh
    networks:
      - nw-provider
    deploy:
      resources:
        limits:
          cpus: 1.0
          memory: 100m
    healthcheck:
      test: [ 'CMD', 'wget', '--spider', '-q', 'http://localhost:8080/healthz' ]
      start_period: 5s
      interval: 5m
    depends_on:
      api-provider:
        condition: service_healthy

  # Main Infrastructure API at Provider side
  api-provider-infra:
    container_name: api-provider-infra
    image: alpine/webhook:latest
    hostname: infra-provider
    pull_policy: never
    user: 1001:1001
    security_opt:
      - no-new-privileges:true
    build:
      context: .
      dockerfile_inline: |
        FROM alpine:latest
        RUN apk --no-cache add jo webhook
    restart: no # fail fast
    configs:
      - source: infra-hooks.yaml
        target: /usr/webhook/hooks.yaml
      - source: infra-handlers.sh
        target: /usr/webhook/infra-handlers.sh
        mode: 0555
    environment:
      PDC_URL: "http://pdc-provider:3000"
    command: [ "webhook", "-verbose", "-port=8080", "-http-methods=GET,POST", "-hooks=/usr/webhook/hooks.yaml" ]
    networks:
      - nw-provider
    deploy:
      resources:
        limits:
          cpus: 1.0
          memory: 100m
    healthcheck:
      test: [ 'CMD', 'wget', '--spider', '-q', 'http://localhost:8080/hooks/healthz' ]
      start_period: 5s
      interval: 5m
    depends_on:
      ngrok-tunnel:
        condition: service_healthy
      api-provider:
        condition: service_healthy

  ######################################################################################################################

  # Main data consumer API accepting any callbacks and returning static JSON
  api-consumer:
    container_name: api-consumer
    image: alpine/webhook:latest
    restart: no # fail fast
    user: 1001:1001
    security_opt:
      - no-new-privileges:true
    build:
      context: .
      dockerfile_inline: |
        FROM alpine:latest
        RUN apk --no-cache add jo webhook
    configs:
      - source: consumer-server.sh
        target: /usr/app/entrypoint.sh
        mode: 0555
    entrypoint: /usr/app/entrypoint.sh
    networks:
      - nw-consumer
    deploy:
      resources:
        limits:
          cpus: 1.0
          memory: 100m
    healthcheck:
      test: [ 'CMD', 'wget', '--spider', '-q', 'http://localhost:8080/healthz' ]
      start_period: 5s
      interval: 5m
    depends_on:
      ngrok-tunnel:
        condition: service_healthy
      api-provider:
        condition: service_healthy

  # Main Infrastructure API at Provider side
  api-consumer-infra:
    extends:
      service: api-provider-infra
    container_name: api-consumer-infra
    hostname: infra-consumer
    environment:
      PDC_URL: "http://pdc-consumer:3000"
    networks:
      - nw-consumer
    depends_on:
      api-consumer:
        condition: service_healthy

########################################################################################################################

configs:
  # Provider API config
  cfg-hz:
    content: "OK"

  # - set proper mime type for non-HTML responses
  # - set basic authentication for specific path
  cfg-httpd.conf:
    content: |
      .json:application/json;charset=utf-8
      .csv:text/csv;charset=utf-8
      /dp0/:admin:admin

  # Dataset and resource descriptor for provider (Datasource)
  dp0.json:
    content: '{"type": "REST", "content": {"url": "http://provider-api:8080/dp0/data.csv"}}'

  dp0-data.csv:
    content: |
      Name,Age,Department
      Alice,30,Engineering
      Bob,25,Marketing
      Charlie,35,Sales

  # Simple consumer API config
  provider-server-wrapper.sh:
    content: |
      #!/usr/bin/env sh
      trap "echo 'Caught stop signal! Exiting...'; exit 0;" INT TERM
      "$@" &
      wait $${!}

  # Simple consumer API config
  provider-status-server.sh:
    content: |
      #!/usr/bin/env sh
      trap "echo 'Caught stop signal! Exiting...'; exit 0;" INT TERM
      while true; do
        echo -e '\n\nWaiting for webhooks...'
        printf 'HTTP/1.1 200 OK\r\n\r\n%s\n' | nc -vnl -p 8080 &
        wait $${!}
      done

  # Simple consumer API config
  consumer-server.sh:
    content: |
      #!/usr/bin/env sh
      trap "echo 'Caught stop signal! Exiting...'; exit 0;" INT TERM
      while true; do
        echo -e '\n\nWaiting for connections...'
        body="$$(jo timestamp=$$(date +%s) participant=CONSUMER status=OK)"
        resp='HTTP/1.1 200 OK\r\nContent-Type: application/json\r\nContent-Length: %s\r\n\r\n%s\n'
        printf "$${resp}" "$$(echo "$${body}" | wc -c)" "$${body}" | nc -vnl -p 8080 &
        wait $${!}
      done

  # Define webhooks and bind handler scripts
  infra-hooks.yaml:
    content: |
      ############### Healthcheck ###############
      - id: healthz
        execute-command: "true"
      ############### Synchronous Infra webhook ###############
      - id: infra/sync
        execute-command: /usr/webhook/infra-handlers.sh
        include-command-output-in-response: true
        pass-arguments-to-command:
          - source: string
            name: sync
        response-headers:
          - name: Content-Type
            value: application/json;charset=utf-8
        pass-environment-to-command:
          - source: payload
            name: data
            envname: HOOK_DATA
          - source: entire-payload
            envname: PAYLOAD
          ## For debugging purposes
          #- source: entire-headers
          #  envname: HEADERS
      ############### Asynchronous Infra webhook ###############
      - id: infra/async
        execute-command: /usr/webhook/infra-handlers.sh
        response-message: '{"code":200,"content":{"mode":"async","status":"Processing"}}'
        pass-arguments-to-command:
          - source: string
            name: async
        response-headers:
          - name: Content-Type
            value: application/json;charset=utf-8
        pass-environment-to-command:
          - source: header
            name: X-Ptx-Service-Chain-Id
            envname: CHAIN_ID
          - source: header
            name: X-Ptx-Target-Id
            envname: TARGET_ID
          - source: payload
            name: data
            envname: HOOK_DATA
          - source: payload
            name: params
            envname: HOOK_PARAMS
          ## For debugging purposes
          #- source: entire-payload
          #  envname: PAYLOAD
          #- source: entire-headers
          #  envname: HEADERS

  infra-handlers.sh:
    content: |
      #!/usr/bin/env sh
      PROCESSED_DATA=$$(jo timestamp="$$(date +%s)" processed-by="$${HOSTNAME}" orig="$${HOOK_DATA}")
      if [ "$${1:?}" = "sync" ]; then
        # Overwrite payload data
        echo $$(echo "$${PAYLOAD}" | jo -f- -D data="$${PROCESSED_DATA}")
        exit 0
      fi
      # Simulating async processing
      echo -e "\nWaiting for simulated async infra task..."
      sleep 3s
      # Resuming
      RESUME_URL="$${PDC_URL}/service-chain/resume"
      # Escape jo-specific notations
      case "$${CHAIN_ID}" in [@:%]*) CHAIN_ID="\\$${CHAIN_ID}" ;; esac
      # Create resume callback body
      CB_BODY=$$(jo chainId="$${CHAIN_ID}" targetId="$${TARGET_ID}" data="$${PROCESSED_DATA}" params="$${HOOK_PARAMS}")
      echo -e "\nAssembled callback body:\n$$(echo "$${CB_BODY}" | jo -f- -p)" \
              "\n\nInvoking service chain resuming callback on $${RESUME_URL}..."
      # Invoke callback
      wget -qS -T5 -O- --header "Content-Type: application/json;charset=utf-8" --post-data "$${CB_BODY}" $${RESUME_URL}