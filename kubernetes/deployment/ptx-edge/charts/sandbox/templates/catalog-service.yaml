apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.catalog.name | default "catalog" }}
  namespace: {{ .Values.ns }}
  labels:
    {{- include "sandbox.commonLabels" (list . "catalog") | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.catalog.name | default "catalog" }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
  type: NodePort
  ports:
    - name: catalog-port
      port: 8888
      targetPort: catalog-port
      nodePort: 30032