{{- if ne (.Values.minimalSetup | toString | lower) "true" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.contract.name | default "contract" }}
  namespace: {{ .Values.ns }}
  labels:
    {{- include "sandbox.commonLabels" (list . "contract") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.contract.name | default "contract" }}
      app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
  template:
    metadata:
      labels:
        {{- include "sandbox.commonLabels" (list . "contract") | nindent 8 }}
    spec:
      containers:
        - name: {{ .Values.contract.name | default "contract" }}
          image: {{ .Values.contract.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: contract-port
              containerPort: 8082
      restartPolicy: Always
{{- end -}}