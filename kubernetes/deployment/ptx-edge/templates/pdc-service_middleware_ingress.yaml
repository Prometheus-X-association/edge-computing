{{- $nodeList := lookup "v1" "Node" "" "" -}}
{{- $privacyZones := list -}}
{{- $labelPrefix := "privacy-zone.dataspace.ptx.org/" -}}

{{- if and $nodeList $nodeList.items (gt (len $nodeList.items) 0) -}}
  {{- range $node := $nodeList.items -}}
    {{- if and $node.metadata $node.metadata.labels -}}
      {{- range $label, $value := $node.metadata.labels -}}
        {{- if and (hasPrefix $labelPrefix $label) (eq ($value | toString | lower) "true") -}}
          {{- $privacyZones = append $privacyZones (trimPrefix $labelPrefix $label) -}}
        {{- end -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
{{- else -}}
  {{- $privacyZones = list "test-zone-1" "test-zone-2" -}}
{{- end -}}
{{- $privacyZones = uniq $privacyZones -}}

{{- if $privacyZones -}}
{{- range $zone := $privacyZones -}}
---
{{- $srvName := printf "%s-%s" $.Values.connector.shortName $zone }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $srvName }}
  labels:
    {{- include "edge.commonLabels" (list $ "connector" "edge") | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ $.Values.connector.name }}
    app.kubernetes.io/version: {{ $.Chart.AppVersion | quote }}
    connector.dataspace.ptx.org/id: {{ printf "pdc-%s" $zone }}
  type: ClusterIP
  ports:
    - name: pdc-port
      port: {{ $.Values.connector.port | int }}
      targetPort: pdc-port
---
{{- $mwrName := printf "%s-stripprefix" $srvName -}}
{{- $zonePrefix := printf "/%s/%s/%s" $.Release.Namespace $zone $.Values.connector.shortName }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $mwrName }}
  labels:
    {{- include "edge.commonLabels" (list $ "connector" "edge") | nindent 4 }}
spec:
  stripPrefix:
    prefixes:
      - {{ $zonePrefix }}
---
{{- $ingName := printf "%s-%s" $.Values.connector.shortName $zone -}}
{{- $entryPoint := ternary "websecure" "web" (eq ($.Values.gateway.proto | toString | lower) "https") -}}
{{- $tls := ternary "true" "false" (eq ($.Values.gateway.proto | toString | lower) "https") -}}
{{- $mwrRef := printf "%s-%s@kubernetescrd" $.Release.Namespace $mwrName }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $ingName }}
  labels:
    {{- include "edge.commonLabels" (list $ "connector" "edge") | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: {{ $entryPoint }}
    traefik.ingress.kubernetes.io/router.tls: {{ $tls | quote }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ $mwrRef }}
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: {{ $zonePrefix }}
            pathType: Prefix
            backend:
              service:
                name: {{ $srvName }}
                port:
                  name: pdc-port
{{ end -}}
{{- end -}}