apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.restapi.name }}
  labels:
    {{- include "edge.commonLabels" (list . "restapi" "edge") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.restapi.name }}
      app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
  template:
    metadata:
      labels:
        {{- include "edge.commonLabels" (list . "controller" "edge") | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.restapi.name }}
      {{- include "edge.controlPlaneSelector" . | nindent 6 }}
      containers:
        - name: {{ .Values.restapi.name }}
          image: {{ include "edge.imageRef" (list . "restapi") | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - uvicorn
            - app.main:app
            - --host=0.0.0.0
            - --port={{ .Values.restapi.port }}
            - --workers=2
            - --proxy-headers
            - --forwarded-allow-ips='*'
            - --access-log
            - --log-level=debug
          env:
            - name: API_ROOT_PATH
              value: {{ .Values.restapi.prefix | quote }}
            - name: API_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: api-port
              containerPort: {{ .Values.restapi.port }}
              protocol: TCP
          {{- with .Values.restapi.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.restapi.healthEndpoint }}
          livenessProbe:
            httpGet:
              port: {{ .Values.restapi.port }}
              path: {{ include "edge.joinPath" (list .Values.restapi.prefix .Values.restapi.healthEndpoint) }}
            initialDelaySeconds: 30
            periodSeconds: 30
          {{- end }}
      restartPolicy: Always