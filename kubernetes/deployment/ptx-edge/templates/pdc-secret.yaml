---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ .Values.mongodb.credential.secretName }}
  labels:
    {{- include "edge.commonLabels" (list . "connector" "dataspace") | nindent 4 }}
data:
  PDC_DB_NAME: "{{ default "dataspace-connector" .Values.mongodb.credential.dbName | b64enc }}"
  PDC_DB_USER: "{{ default "pdc" .Values.mongodb.credential.dbUser | b64enc }}"
  PDC_DB_PASSWORD: "{{ default (randAlphaNum 12) .Values.mongodb.credential.dbPassword | b64enc }}"
immutable: true
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ .Values.connector.credential.secretName }}
  labels:
    {{- include "edge.commonLabels" (list . "connector" "dataspace") | nindent 4 }}
data:
  SERVICE_KEY: "{{ required "PDC <serviceKey> is missing!" .Values.connector.credential.serviceKey | b64enc }}"
  SECRET_KEY: "{{ required "PDC <secretKey> is missing!" .Values.connector.credential.secretKey | b64enc }}"
  EXCHANGE_TRIGGER_API_KEY: "{{ default "" .Values.connector.credential.triggerKey | b64enc }}"
immutable: true
---