---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ .Values.mongodb.credential.secretName }}
  labels:
    {{- include "edge.commonLabels" (list . "connector" "dataspace") | nindent 4 }}
data:
  MONGO_DB_NAME: "{{ (.Values.mongodb.credential.dbName | default "dataspace-connector") | b64enc }}"
  MONGO_DB_USER: "{{ (.Values.mongodb.credential.dbUser | default .Values.connector.shortName) | b64enc }}"
  MONGO_DB_PASSWORD: "{{ (.Values.mongodb.credential.dbPassword | default (randAlphaNum 12)) | b64enc }}"
immutable: true
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ .Values.connector.credential.secretName }}
  labels:
    {{- include "edge.commonLabels" (list . "connector" "dataspace") | nindent 4 }}
data:
  SERVICE_KEY: "{{ required "PDC <serviceKey> is missing!" .Values.connector.credential.serviceKey | toString | b64enc }}"
  SECRET_KEY: "{{ required "PDC <secretKey> is missing!" .Values.connector.credential.secretKey | toString | b64enc }}"
  EXCHANGE_TRIGGER_API_KEY: "{{ (.Values.connector.credential.triggerKey | default "") | toString | b64enc }}"
immutable: true
---