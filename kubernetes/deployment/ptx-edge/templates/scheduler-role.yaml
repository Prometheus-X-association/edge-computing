apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.scheduler.name }}
  labels:
    {{- include "edge.commonLabels" (list . "scheduler" "edge") | nindent 4 }}
rules:
  - apiGroups: [ "", ]
    resources: [ "pods" ]
    verbs: [ "watch", "list" ]
  - apiGroups: [ "", ]
    resources: [ "bindings", "events" ]
    verbs: [ "create" ]