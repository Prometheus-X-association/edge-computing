apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.restapi.name }}
  labels:
    {{- include "edge.commonLabels" (list . "restapi" "edge") | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ $.Values.restapi.name }}
    app.kubernetes.io/version: {{ $.Chart.AppVersion | quote }}
  type: ClusterIP
  ports:
    - name: api-port
      port: {{ .Values.restapi.port }}
      targetPort: api-port