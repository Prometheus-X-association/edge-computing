apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.connector.name }}
  labels:
    {{- include "edge.commonLabels" (list . "connector" "dataspace") | nindent 4 }}
data:
  .env: |
    NODE_ENV={{ .Values.connector.config.nodeEnv }}
    PORT={{ .Values.connector.port | int }}
    #
    SESSION_SECRET={{ default (randAlphaNum 32) .Values.connector.credential.sessionSecret }}
    SESSION_COOKIE_EXPIRATION={{ default 24000 .Values.connector.credential.sessionSecretExpiration }}
    #
    MONGO_URI="{{ include "pdc.mongoURI" . }}"
    #
    CURATOR=https://visionspol.eu
    MAINTAINER=https://visionspol.eu
    #
    WINSTON_LOGS_MAX_FILES=14d
    WINSTON_LOGS_MAX_SIZE=20m
    #
    JWT_BEARER_TOKEN_EXPIRATION=3h
    JWT_REFRESH_TOKEN_EXPIRATION=1d
    #
    EXCHANGE_TRIGGER_API_KEY=${EXCHANGE_TRIGGER_API_KEY}
    EXCHANGE_TIMEOUT=120
  {{- if .Values.global.sandboxed }}
  dataspace-config.json: |
    {
      "endpoint": "http://${PDC_ID}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.connector.port | int }}/",
      "serviceKey": "{{ required "Sandbox <serviceKey is missing!>" .Values.sandbox.credential.serviceKey }}",
      "secretKey": "{{ required "Sandbox <secretKey is missing!>" .Values.sandbox.credential.secretKey }}",
      "contractUri": "http://{{ .Values.sandbox.contract }}.{{ .Values.sandbox.ns }}.svc.cluster.local:8888/",
      "catalogUri": "http://{{ .Values.sandbox.catalog }}.{{ .Values.sandbox.ns }}.svc.cluster.local:8888/v1/",
      "consentUri": "http://{{ .Values.sandbox.consent }}.{{ .Values.sandbox.ns }}.svc.cluster.local:8888/v1/"
    }
  {{- else }}
  dataspace-config.json: |
    {
      "endpoint": "{{ include "pdc.pdcEntrypoint" . }}",
      "serviceKey": "${SERVICE_KEY}",
      "secretKey": "${SECRET_KEY}",
      "contractUri": "{{ required "Dataspace <contractURI> is missing!" .Values.dataspace.contractUri }}",
      "catalogUri": "{{ required "Dataspace <catalogUri> is missing!" .Values.dataspace.catalogUri }}",
      "consentUri": "{{ .Values.dataspace.consentUri }}",
      "credentials": [],
      "expressLimitSize": "{{ default "100mb" .Values.connector.config.expressLimitSize }}",
      "serviceChainAdapter": "{{ default false .Values.connector.config.serviceChainAdapter }}",
      "serviceChainAdapterTimeout": "{{ default 3000 .Values.connector.config.serviceChainAdapterTimeout | int }}"
    }
    {{- end }}
immutable: false