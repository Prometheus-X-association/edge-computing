apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.connector.name }}
  labels:
    {{- include "edge.commonLabels" (list . "connector" "dataspace") | nindent 4 }}
rules:
  - apiGroups: [ "" ]
    resources: [ "pods" ]
    verbs: [ "patch" ]
  - apiGroups: [ "" ]
    resources: [ "services" ]
    verbs: [ "create", "delete" ]
  - apiGroups: [ networking.k8s.io ]
    resources: [ ingresses ]
    verbs: [ create, delete ]
  - apiGroups: [ traefik.io ]
    resources: [ middlewares ]
    verbs: [ create, delete ]