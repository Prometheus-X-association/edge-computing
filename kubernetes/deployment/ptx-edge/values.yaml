# Default values for ptx-edge.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# global configurations
global:
  # env marks the deployment state: e.g., production, development, test, demo, etc.
  env: production
  # useControlPlane restricts ptx-edge component deployment on cluster nodes marked as control plane.
  # This feature expects using 'node-role.kubernetes.io/control-plane' label for designating the node role.
  useControlPlane: true

# gateway contains access setting of the underlying cluster's ingress
gateway:
  # proto is the used protocol based on whether TLS is enabled in the cluster gateway or not (default: https)
  proto: https
  # host is the hostname/IP address of the cluster gateway externally accessible by dataspace participants (required)
  host:
  # port is the exposed port of the cluster gateway (required)
  port:

# registry of the ptx-edge component's images
registry:
  # url of the common registry (default: "")
  url:
  # port of the common registry (default: "")
  port:

# localRegistry contains settings for the cluster-local registry in which collected images are cached
localRegistry:
  # url of the local registry
  url: "registry.k3d.local"
  # port of the local registry
  port: 5000

# dataspace contains the URIs of the dataspace components which the PDC connects to (default: VisionTrust's components)
dataspace:
  # contractUri is the base URL of the Contract Manager service (required)
  contractUri: "https://contract.visionstrust.com/"
  # catalogUri is the base URL of the Dataspace Catalog service (required)
  catalogUri: "https://api.visionstrust.com/v1/"
  # consentUri is the base URL of the Consent Manager service (optional)
  consentUri: "https://consent.visionstrust.com/v1"

########################################################################################################################

# connector contains PDC related settings
connector:
  # name of the connector component
  name: connector
  # shortName is used in resource names and URLs related to the connector (default: pdc)
  shortName: pdc
  # domain explicitly defines the image NAMESPACE according to [HOST[:PORT]/]NAMESPACE/REPOSITORY[:TAG]
  domain: ptx
  # image defines the REPOSITORY or whole image ref where domain and version can be undefined
  image: connector
  # version explicitly defines the image tag (default: appVersion defined in chart)
  version: 1.11.0-slim
  # port on which the connector listens
  port: 3000
  # credential contains the keys for the pdc instance to communicate with the catalog
  credential:
    # secretName is the generated secret containing the PDC credentials in the cluster
    secretName: pdc-secret-env
    # serviceKey is the Client ID API credential for the catalogue (required)
    serviceKey:
    # secretKey is the Client Secret API credential for the catalogue (required)
    secretKey:
    # triggerKey is PDC API key to authorize exchanges from the exchange trigger page (optional).
    triggerKey:
    # sessionSecret is a random value for PDC sessions (default: autogenerated)
    sessionSecret:
    # sessionSecretExpiration is the expiration of the session secret (default: 24000)
    sessionSecretExpiration: 24000
  # config contains the connector's runtime configuration
  config:
    # nodeEnv is PDC's running mode (development or production)
    nodeEnv: "development"
    # usedTemplateFile defines the template file to be used from the PDC's configuration (default: dataspace-cfg.json)
    usedTemplateFile: dataspace-cfg.json
    # expressLimitSize is the increased body size of requests that express can accept (default: 2mb)
    expressLimitSize: "100mb"
    # serviceChainAdapter enables the service chain adapter in the PDC (default: false)
    serviceChainAdapter: false
    # serviceChainAdapterTimeout is the request timeout for the service chain adapter (default: 3000)
    serviceChainAdapterTimeout: 3000
  # init contains settings for connector instance deployment and initialization
  init:
    # useControlPlane restricts controller component deployment on cluster nodes explicitly permitted by a specific label.
    # This feature expects using 'connector.dataspace.ptx.org/enabled' label with value 'true' for marking the permission.
    useConnectorNodeFilter: true
    # forceRecreateExposure enables the (re)creation of service/middleware/ingress resources per privacy zone
    forceRecreateExposure: true
  # resources reflects the requested amount of compute resources
  resources:
    requests:
      cpu: 500m
      memory: 250Mi

# mongodb contains MongoDB related settings within the connector deployment
mongodb:
  # name of the mongodb subcomponent
  name: mongodb
  # domain explicitly defines the image NAMESPACE according to [HOST[:PORT]/]NAMESPACE/REPOSITORY[:TAG]
  domain: ptx
  # image defines the REPOSITORY or whole image ref where domain and version can be undefined
  image: mongodb
  # version explicitly defines the image tag (default: appVersion defined in chart)
  version: 8.0.23-slim
  # credential contains the keys for the pdc instance to communicate with MongoDB
  credential:
    # secretName is the generated secret containing the MongoDB credentials for the PDC
    secretName: pdc-mongo-env
    # dbName is the name of the database PDC utilize (default: dataspace-connector)
    dbName: dataspace-connector
    # dbUser is the username used for the PDC's mongoDB component (default: pdc)
    dbUser: pdc
    # dbPassword is the password used for the 'dbUser' (default: autogenerated)
    dbPassword:
  # resources reflects the requested amount of compute resources
  resources:
    requests:
      cpu: 100m
      memory: 150Mi

########################################################################################################################

# builder contains builder related settings
builder:
  # name of the builder component
  name: builder
  # domain explicitly defines the image NAMESPACE according to [HOST[:PORT]/]NAMESPACE/REPOSITORY[:TAG]
  domain: ptx-edge
  # image defines the REPOSITORY or whole image ref where domain and version can be undefined
  image: builder
  # version explicitly defines the image tag (default: appVersion defined in chart)
  version:
  # servicePort is the port on which the builder can listen for incoming connections
  callbackPort: 9999

# controller contains controller related settings
controller:
  # name of the controller component
  name: controller
  # domain explicitly defines the image NAMESPACE according to [HOST[:PORT]/]NAMESPACE/REPOSITORY[:TAG]
  domain: ptx-edge
  # image defines the REPOSITORY or whole image ref where domain and version can be undefined
  image: controller
  # version explicitly defines the image tag (default: appVersion defined in chart)
  version:
  # port on which the controller listens
  port: 8080
  # healthEndpoint is the path part of the controller's liveness URL
  healthEndpoint: /healthz
  # resources reflects the requested amount of compute resources
  resources:
    requests:
      cpu: 1000m
      memory: 200Mi

# scheduler contains scheduler related settings
scheduler:
  # name of the scheduler component
  name: scheduler
  # refName is used to bind pods to the ptx-edge scheduler
  refName: ptx-edge-scheduler
  # domain explicitly defines the image NAMESPACE according to [HOST[:PORT]/]NAMESPACE/REPOSITORY[:TAG]
  domain: ptx-edge
  # image defines the REPOSITORY or whole image ref where domain and version can be undefined
  image: scheduler
  # version explicitly defines the image tag (default: appVersion defined in chart)
  version:
  # method defined the used scheduling algorithm (random or generic)
  method: genetic
  # resources reflects the requested amount of compute resources
  resources:
    requests:
      cpu: 1000m
      memory: 200Mi

# restapi contains REST-API related settings
restapi:
  # name of the REST-API component
  name: rest-api
  # domain explicitly defines the image NAMESPACE according to [HOST[:PORT]/]NAMESPACE/REPOSITORY[:TAG]
  domain: ptx-edge
  # image defines the REPOSITORY or whole image ref where domain and version can be undefined
  image: rest-api
  # version explicitly defines the image tag (default: appVersion defined in chart)
  version:
  # port on which the api listens
  port: 8080
  # prefix is used as the root URL for endpoints
  prefix: /ptx-edge/api/v1
  # healthEndpoint is the path part of the restapi's liveness URL
  healthEndpoint: /health
  # resources reflects the requested amount of compute resources
  resources:
    requests:
      cpu: 1000m
      memory: 300Mi

########################################################################################################################

# sandbox contains sandbox related settings mainly for testing and development purposes
sandbox:
  # enabled allows testing the connector with in-cluster mocked dataspace services (default: false)
  enabled: true
  # ns is the namespace of the sandbox set up within the cluster
  ns: ptx-sandbox
  # minimalSetup enables only the <catalog> service minimally necessary for PDC initialization
  minimalSetup: true
  # catalog contains settings for the Dataspace Catalog service
  catalog:
    # name of Dataspace Catalog service in the sandbox
    name: catalog