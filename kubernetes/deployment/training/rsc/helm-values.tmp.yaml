global:
  env: ${ENV}
  useControlPlane: true

gateway:
  proto: https
  host: ${GW_HOST}
  port:

registry:
  url: ${REGISTRY}
  port: ${REGISTRY_PORT}

localRegistry:
  name: registry
  url: ${REGISTRY}
  port: ${REGISTRY_PORT}
  rootCAFilePath:
  rootCAFileContent:  # set via '--set-file'

dataspace:
  contractUri: ${PTX_CONTRACT_URI}
  catalogUri: ${PTX_CATALOG_URI}
  consentUri: ${PTX_CONSENT_URI}

########################################################################################################################

connector:
  name: connector
  shortName: ${PDC}
  domain:
  image: ${PDC_IMG}
  version: ""
  port: ${PDC_PORT}
  credential:
    secretName: ${PDC_SECRET_NAME}
    serviceKey: ${PDC_SERVICE_KEY}
    secretKey: ${PDC_SECRET_KEY}
    triggerKey: ${PDC_EXCHANGE_TRIGGER_API_KEY}
    sessionSecret: ${PDC_SESSION_SECRET}
    sessionSecretExpiration: 24000
  config:
    nodeEnv: ${PDC_ENV}
    expressLimitSize: "100mb"
    serviceChainAdapter: false
    serviceChainAdapterTimeout: 3000
  init:
    useConnectorNodeFilter: true
    forceRecreateExposure: true
  resources:
    requests:
      cpu: 500m
      memory: 250Mi

mongodb:
  name: mongodb
  domain:
  image: ${MONGODB_IMG}
  version: ""
  credential:
    secretName: pdc-mongo-env
    dbName: ${MONGO_DB_NAME}
    dbUser: ${MONGO_DB_USER}
    dbPassword: ${MONGO_DB_PASSWORD}
  resources:
    requests:
      cpu: 100m
      memory: 150Mi

########################################################################################################################

builder:
  name: ${BUILDER}
  domain:
  image: ${BUILD_IMG}
  version: ""
  callbackPort: ${BUILD_PORT}

controller:
  name: ${CONTROLLER}
  domain:
  image: ${CONTROL_IMG}
  version: ""
  port: ${CNTR_PORT}
  healthEndpoint: /${CNTR_LIVE_PATH}
  resources:
    requests:
      cpu: 1000m
      memory: 200Mi

scheduler:
  name: ${SCHEDULER}
  refName: ${SCHEDULER_REF}
  domain:
  image: ${SCHED_IMG}
  version: ""
  method: ${SCHEDULER_METHOD}
  resources:
    requests:
      cpu: 1000m
      memory: 200Mi

restapi:
  name: ${REST_API}
  domain:
  image: ${API_IMG}
  version: ""
  port: ${API_PORT}
  credential:
    secretName: ${API_CRED_NAME}
    htpasswdUser: ${API_CREDS}
  prefix: /${PREFIX}
  healthEndpoint: /health
  resources:
    requests:
      cpu: 1000m
      memory: 300Mi

########################################################################################################################

sandbox:
  enabled: ${USE_SANDBOX}
  ns: ${SANDBOX}
  minimalSetup: true
  catalog:
    name: ${CATALOG}
    image: ${REGISTRY}:${REGISTRY_PORT}/${CATALOG_IMG}